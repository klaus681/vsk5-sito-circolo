<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eventi – CVI Virtual</title>
  <meta name="robots" content="noindex,follow">
  <link rel="canonical" href="https://circolovelicoitalia.it/eventi.html">
  <meta http-equiv="refresh" content="0;url=eventi.html">
  <style>
    body { background: #0b0f19; color: #94a3b8; font-family: system-ui, sans-serif; margin: 0; padding: 3rem 1.5rem; text-align: center; }
    a { color: #38bdf8; font-weight: 700; }
  </style>
  <script>
    /* Eventi aperti e Serie Aperte sono confluite nell'area unica Eventi.
       I vecchi ancori (#serie-… / #evento-…) vengono portati sulla pagina
       di dettaglio del singolo evento. */
    (function () {
      var hash = location.hash || "";
      var m = hash.match(/^#(serie|evento)-(.+)$/);
      var target = m
        ? "evento.html?tipo=" + m[1] + "&id=" + encodeURIComponent(decodeURIComponent(m[2]))
        : "eventi.html" + hash;
      location.replace(target);
    })();
  </script>
</head>
<body>
  <p>La pagina <strong>Eventi aperti</strong> è confluita nell’area unica <strong>Eventi</strong>.</p>
  <p><a href="eventi.html">Vai a Eventi →</a></p>
</body>
</html>
