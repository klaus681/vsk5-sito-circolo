          <input type="password" id="password" required placeholder="••••••••" style="width: 100%; padding: 0.8rem; background: #111827; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 4px;">
        </div>
        
        <button type="submit" style="width: 100%; background: #0099ff; color: white; padding: 0.8rem; border: none; border-radius: 4px; font-weight: 600; cursor: pointer;" data-i18n="btn_login">Accedi</button>

    const traduzioni = {
      it: {

        footer_register_link: "Regístrate aquí",

        alert_error: "Error de inicio de sesión: "
      }
    };

    let currentLang = localStorage.getItem('cvi_lang') || 'it';
    const langSelect = document.getElementById('languageSelect');
    if (langSelect) langSelect.value = currentLang;

    function cambiaLingua(lang) {
      currentLang = lang;
      localStorage.setItem('cvi_lang', lang);
      
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (traduzioni[lang][key]) {
          el.textContent = traduzioni[lang][key];
        }
      });
      aggiornaTestoAuth();
    }

    async function aggiornaTestoAuth() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      const authLink = document.getElementById('auth-link');
      if (session && authLink) {
        authLink.href = "membri.html";
        authLink.textContent = traduzioni[currentLang]['nav_area_membri'];
      }
    }

    const loginForm = document.getElementById('login-form');
    if (loginForm) {
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password,
        });

        if (error) {
          alert(traduzioni[currentLang]['alert_error'] + error.message);
        } else {
          alert(traduzioni[currentLang]['alert_success']);
          window.location.href = "membri.html";
        }
      });
    }

    aggiornaTestoAuth();
    cambiaLingua(currentLang);
  </script>
