  <link rel="stylesheet" href="style.css">
  <style>
    .page-content {
      padding: 130px 2rem 4rem 2rem;
      max-width: 500px;
      margin: 0 auto;
    }
    .login-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 2.5rem;
      border-radius: 8px;
    }
    .login-box h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      color: #38bdf8;
      text-align: center;
    }
    .login-box > p {
      color: #9ca3af;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 2rem;
      text-align: center;
    }
    .form-group {
      margin-bottom: 1.2rem;
    }
    .form-group label {
      display: block;
      color: #d1d5db;
      margin-bottom: 0.4rem;
      font-size: 0.9rem;
    }
    .form-group input {
      width: 100%;
      padding: 0.8rem;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      color: #fff;
      font-size: 1rem;
    }
    .form-group input:focus {
      outline: none;
      border-color: #38bdf8;
    }
    .btn-submit {
      width: 100%;
      background-color: #0099ff;
      color: #fff;
      padding: 0.8rem;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 1rem;
    }
    .btn-submit:hover {
      background-color: #0077cc;
    }
    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      color: #9ca3af;
      font-size: 0.9rem;
    }
    .auth-footer a {
      color: #38bdf8;
      text-decoration: none;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
    .forgot-password {
      display: block;
      text-align: right;
      margin-top: -0.5rem;
      margin-bottom: 1rem;
      font-size: 0.85rem;
      color: #38bdf8;
      text-decoration: none;
    }
    .forgot-password:hover {
      text-decoration: underline;
    }
    .logged-in-container {
      text-align: center;
    }
    .btn-logout {
      background-color: #ef4444;
      margin-top: 1.5rem;
    }
    .btn-logout:hover {
      background-color: #dc2626;
    }
    /* Stile per il selettore della lingua nel menu */
    .lang-selector {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
