<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accedi - Circolo Velico Italia VSK5</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .page-content {
      padding: 130px 2rem 4rem 2rem;
      max-width: 500px;
      margin: 0 auto;
    }
    .login-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 2.5rem;
      border-radius: 8px;
    }
    .login-box h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      color: #38bdf8;
      text-align: center;
    }
    .login-box > p {
      color: #9ca3af;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 2rem;
      text-align: center;
    }
    .form-group {
      margin-bottom: 1.2rem;
    }
    .form-group label {
      display: block;
      color: #d1d5db;
      margin-bottom: 0.4rem;
      font-size: 0.9rem;
    }
    .form-group input {
      width: 100%;
      padding: 0.8rem;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      color: #fff;
      font-size: 1rem;
    }
    .form-group input:focus {
      outline: none;
      border-color: #38bdf8;
    }
    .btn-submit {
      width: 100%;
      background-color: #0099ff;
      color: #fff;
      padding: 0.8rem;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 1rem;
    }
    .btn-submit:hover {
      background-color: #0077cc;
    }
    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      color: #9ca3af;
      font-size: 0.9rem;
    }
    .auth-footer a {
      color: #38bdf8;
      text-decoration: none;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
    .forgot-password {
      display: block;
      text-align: right;
      margin-top: -0.5rem;
      margin-bottom: 1rem;
      font-size: 0.85rem;
      color: #38bdf8;
      text-decoration: none;
    }
    .forgot-password:hover {
      text-decoration: underline;
    }
    .logged-in-container {
      text-align: center;
    }
    .btn-logout {
      background-color: #ef4444;
      margin-top: 1.5rem;
    }
    .btn-logout:hover {
      background-color: #dc2626;
    }
  </style>

  <!-- Libreria JavaScript di Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header>
    <a href="index.html" class="logo-container">
      <img src="logo-cvi.png" alt="Circolo Velico Italia - VSK5" class="logo-img">
    </a>
    
    <nav>
      <ul id="nav-menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="team.html">Team</a></li>
        <li class="dropdown">
          <a href="#">Gare & Eventi ▾</a>
          <ul class="dropdown-menu">
            <li><a href="classifiche.html">Classifiche</a></li>
          </ul>
        </li>
        <li><a href="albo-doro.html">Albo d'Oro</a></li>
        <li><a href="regolamento.html">Regolamento</a></li>
        <li><a href="download.html">Download</a></li>
        <li><a href="contatti.html">Contatti</a></li>
        <li><a href="membri.html">Membri</a></li>
        <li><a href="unisciti.html" class="btn-unisciti">Unisciti</a></li>
        <li><a href="accedi.html" class="active btn-accedi">Accedi</a></li>
      </ul>
    </nav>
  </header>

  <main class="page-content">
    <div class="login-box" id="auth-box">
      <!-- Contenuto dinamico gestito da JS (Form di login oppure Pannello utente loggato) -->
      <h1>Accedi</h1>
      <p>Inserisci le tue credenziali per entrare nell'area riservata.</p>
      
      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="tuamail@example.com">
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>
        
        <a href="#" id="forgot-btn" class="forgot-password">Password dimenticata?</a>
        
        <button type="submit" class="btn-submit">Accedi</button>
      </form>

      <div class="auth-footer">
        Non hai ancora un account? <a href="unisciti.html">Unisciti qui</a>
      </div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://kisffsyerranniypkcqa.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtpc2Zmc3llcnJhbm5peXBrY3FhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5MTgxMTgsImV4cCI6MjEwNjQ5NDExOH0.1PNoShPUl32yN3aQenRNan_SCTxtKacr_VVwi5uaELs';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const authBox = document.getElementById('auth-box');

    // Funzione per controllare lo stato dell'utente all'avvio della pagina
    async function checkUserSession() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      
      if (session) {
        // Se l'utente è già loggato, mostra la schermata di benvenuto con il tasto Disconnetti
        authBox.innerHTML = `
          <h1>Area Riservata</h1>
          <p>Sei attualmente connesso come: <br><strong>${session.user.email}</strong></p>
          <button id="logout-btn" class="btn-submit btn-logout">Disconnetti</button>
        `;

        document.getElementById('logout-btn').addEventListener('click', async () => {
          const { error } = await supabaseClient.auth.signOut();
          if (error) {
            alert("Errore durante la disconnessione: " + error.message);
          } else {
            alert("Disconnessione effettuata con successo!");
            window.location.reload(); // Ricarica la pagina per tornare al form di login
          }
        });
      }
    }

    checkUserSession();

    // Gestione del form di login
    const loginForm = document.getElementById('login-form');
    if (loginForm) {
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password,
        });

        if (error) {
          alert("Errore durante l'accesso: " + error.message);
        } else {
          alert("Accesso effettuato con successo!");
          window.location.href = "membri.html";
        }
      });
    }

    // Gestione del recupero password
    const forgotBtn = document.getElementById('forgot-btn');
    if (forgotBtn) {
      forgotBtn.addEventListener('click', async (e) => {
        e.preventDefault();
        const email = prompt("Inserisci l'indirizzo email associato al tuo account per il recupero della password:");
        
        if (email) {
          const { data, error } = await supabaseClient.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.href, // reindirizza qui o a una pagina di reset dedicata
          });

          if (error) {
            alert("Errore nell'invio dell'email di recupero: " + error.message);
          } else {
            alert("Ti è stata inviata un'email con le istruzioni per reimpostare la password.");
          }
        }
      });
    }
  </script>

</body>
</html>
