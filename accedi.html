<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accedi - Circolo Velico Italia VSK5</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .page-content {
      padding: 140px 2rem 4rem 2rem;
      max-width: 450px;
      margin: 0 auto;
    }
    .login-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 2.5rem;
      border-radius: 8px;
    }
    .login-card h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      color: #38bdf8;
      text-align: center;
    }
    .login-card p {
      color: #9ca3af;
      font-size: 0.95rem;
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }
    .login-form input {
      padding: 0.9rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      color: #fff;
      font-size: 1rem;
    }
    .login-form button {
      background-color: #0099ff;
      color: #fff;
      border: none;
      padding: 0.9rem;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .login-form button:hover {
      background-color: #0077cc;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo-container">
      <img src="logo-cvi.png" alt="Circolo Velico Italia - VSK5" class="logo-img">
    </a>
    
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="team.html">Team</a></li>
        <li class="dropdown">
          <a href="#">Gare & Eventi ▾</a>
          <ul class="dropdown-menu">
            <li><a href="classifiche.html">Classifiche</a></li>
          </ul>
        </li>
        <li><a href="albo-doro.html">Albo d'Oro</a></li>
        <li><a href="regolamento.html">Regolamento</a></li>
        <li><a href="download.html">Download</a></li>
        <li><a href="contatti.html">Contatti</a></li>
        <li><a href="membri.html">Membri</a></li>
        <li><a href="unisciti.html" class="btn-unisciti">Unisciti</a></li>
        <li><a href="accedi.html" class="active btn-accedi">Accedi</a></li>
      </ul>
    </nav>
  </header>

  <main class="page-content">
    <div class="login-card">
      <h1>Area Soci</h1>
      <p>Inserisci le tue credenziali per accedere</p>
      
      <form class="login-form">
        <input type="email" placeholder="Email o Username" required>
        <input type="password" placeholder="Password" required>
        <button type="submit">Accedi</button>
      </form>
    </div>
  </main>

</body>
</html>
