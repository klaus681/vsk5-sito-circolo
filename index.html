<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circolo Velico Italia - Virtual Skipper</title>
<script>
(async function () {
  const urls = [
    'https://raw.githubusercontent.com/klaus681/vsk5-sito-circolo/main/index.html',
    'https://cdn.jsdelivr.net/gh/klaus681/vsk5-sito-circolo@main/index.html'
  ];
  let html = null, lastErr = null;
  for (const src of urls) {
    try {
      const res = await fetch(src);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      // Controlla che il file scaricato contenga l'HTML vero del sito e non questo loader
      if (text && text.indexOf('<nav') !== -1) {
        html = text;
        break;
      }
    } catch (e) { lastErr = e; }
  }
  if (!html) {
    // Se non trova ancora l'HTML separato, mostra un messaggio pulito
    document.addEventListener('DOMContentLoaded', () => {
      document.body.style.background = '#0b0f19';
      document.body.style.color = '#fff';
      document.body.style.fontFamily = 'sans-serif';
    });
    return;
  }
  document.open();
  document.write(html);
  document.close();
})();
</script>
</head>
<body style="background:#0b0f19;color:#94a3b8;font-family:sans-serif;padding:2rem">
  Caricamento…
</body>
</html>
