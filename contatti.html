  <style>
    .page-content {
      padding: 120px 2rem 4rem 2rem;
      max-width: 600px;
      margin: 0 auto;
    }
    .page-content h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      text-transform: uppercase;
      color: #38bdf8;
    }
    .page-content p {
      color: #9ca3af;
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }
    .contact-form input, .contact-form textarea {
      padding: 0.9rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      color: #fff;
      font-size: 1rem;
    }
    .contact-form input:focus, .contact-form textarea:focus {
      outline: none;
      border-color: #38bdf8;
    }
    .contact-form textarea {
      resize: vertical;
      min-height: 120px;
    }
    .contact-form button {
      background-color: #0099ff;
      color: #fff;
      border: none;
      padding: 0.9rem;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .contact-form button:hover {
      background-color: #0077cc;
    }
    /* Stile per il selettore della lingua nel menu */
    .lang-selector {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }
  </style>

        <li><a href="accedi.html" class="btn-accedi" id="auth-link" data-i18n="nav_accedi">Accedi</a></li>
        
        <li>
          <select id="languageSelect" class="lang-selector" onchange="cambiaLingua(this.value)">
            <option value="it">🇮🇹 IT</option>
            <option value="en">🇬🇧 EN</option>
            <option value="fr">🇫🇷 FR</option>

    <form class="contact-form" id="contact-form">
      <input type="text" id="contact-name" data-i18n-placeholder="placeholder_name" placeholder="Il tuo nome / Nickname" required>
      <input type="email" id="contact-email" data-i18n-placeholder="placeholder_email" placeholder="La tua email" required>
      <textarea id="contact-msg" data-i18n-placeholder="placeholder_msg" placeholder="Il tuo messaggio..." required></textarea>
      <button type="submit" data-i18n="btn_send">Invia Messaggio</button>
    </form>

    let currentLang = localStorage.getItem('cvi_lang') || 'it';
    document.getElementById('languageSelect').value = currentLang;

    function cambiaLingua(lang) {
      currentLang = lang;
      localStorage.setItem('cvi_lang', lang);
      
      // Traduce testi normali
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (traduzioni[lang][key]) {
          el.textContent = traduzioni[lang][key];
        }
      });

      // Traduce i placeholder dei campi input/textarea
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        if (traduzioni[lang][key]) {
          el.placeholder = traduzioni[lang][key];
        }
      });

      aggiornaTestoAuth();
    }

    let isLogged = false;
    async function aggiornaTestoAuth() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      const authLink = document.getElementById('auth-link');
      if (session && authLink) {
        isLogged = true;
        authLink.href = "membri.html";
        authLink.textContent = traduzioni[currentLang]['nav_area_membri'];
      }
    }

    // Gestione invio modulo di contatto
    const contactForm = document.getElementById('contact-form');
    if (contactForm) {
      contactForm.addEventListener('submit', (e) => {
        e.preventDefault();
        alert(traduzioni[currentLang]['msg_sent_success']);
        contactForm.reset();
      });
    }

    aggiornaTestoAuth();
    cambiaLingua(currentLang);
  </script>
