    const _orig = CVI.init;
    CVI.init = function(a) {
      _orig(a, extra);

      document.getElementById('contact-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const nome = document.getElementById('contact-name').value;
        const email = document.getElementById('contact-email').value;
        const messaggio = document.getElementById('contact-msg').value;
        const statusEl = document.getElementById('form-status');
        const translations = extra[CVI.currentLang] || extra.it;

        statusEl.textContent = translations.msg_sending;
        statusEl.style.color = '#38bdf8';

        // Salvataggio nel database Supabase nella tabella 'messaggi'
        const { data, error } = await _supabase
          .from('messaggi')
          .insert([{ nome, email, messaggio }]);

        if (error) {
          console.error('Errore Supabase:', error);
          statusEl.textContent = translations.msg_error;
          statusEl.style.color = '#f87171';
        } else {
          statusEl.textContent = translations.msg_sent_success;
          statusEl.style.color = '#34d399';
          e.target.reset();
        }
      });
    };

    CVI.init('contatti.html');
