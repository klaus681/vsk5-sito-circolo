<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unisciti - Circolo Velico Italia VSK5</title>
  
  <!-- Stili incorporati per evitare problemi di caricamento del CSS -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #0b0f19;
      color: #f3f4f6;
      min-height: 100vh;
    }
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(11, 15, 25, 0.95);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 1000;
    }
    .logo-container img.logo-img {
      height: 45px;
    }
    nav ul {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }
    nav ul li a {
      color: #d1d5db;
      text-decoration: none;
      font-size: 0.95rem;
      transition: color 0.2s;
    }
    nav ul li a:hover, nav ul li a.active {
      color: #38bdf8;
    }
    .btn-unisciti {
      background: #38bdf8;
      color: #0b0f19 !important;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      font-weight: bold;
    }
    .btn-accedi {
      border: 1px solid #38bdf8;
      padding: 0.5rem 1rem;
      border-radius: 4px;
    }
    .lang-selector {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }
    .page-content {
      padding: 140px 2rem 4rem 2rem;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .join-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 2.5rem;
      border-radius: 8px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .join-box h1 {
      font-size: 1.8rem;
      color: #38bdf8;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }
    .join-box p {
      color: #9ca3af;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      color: #e5e7eb;
    }
    .form-group input {
      width: 100%;
      padding: 0.75rem;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      color: #fff;
      font-size: 1rem;
    }
    .form-group input:focus {
      outline: none;
      border-color: #38bdf8;
    }
    .btn-submit {
      width: 100%;
      padding: 0.75rem;
      background: #38bdf8;
      color: #0b0f19;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 1rem;
    }
    .btn-submit:hover {
      background: #0ea5e9;
    }
    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.9rem;
      color: #9ca3af;
    }
    .auth-footer a {
      color: #38bdf8;
      text-decoration: none;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>

  <!-- Libreria JavaScript di Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header>
    <a href="index.html" class="logo-container">
      <img src="logo-cvi.png" alt="Circolo Velico Italia - VSK5" class="logo-img">
    </a>
    
    <nav>
      <ul id="nav-menu">
        <li><a href="index.html" data-i18n="nav_home">Home</a></li>
        <li><a href="team.html" data-i18n="nav_team">Team</a></li>
        <li class="dropdown">
          <a href="#" data-i18n="nav_gare">Gare & Eventi ▾</a>
        </li>
        <li><a href="albo-doro.html" data-i18n="nav_albo">Albo d'Oro</a></li>
        <li><a href="regolamento.html" data-i18n="nav_regolamento">Regolamento</a></li>
        <li><a href="download.html" data-i18n="nav_download">Download</a></li>
        <li><a href="contatti.html" data-i18n="nav_contatti">Contatti</a></li>
        <li><a href="membri.html" data-i18n="nav_membri">Membri</a></li>
        <li><a href="unisciti.html" class="active btn-unisciti" data-i18n="nav_unisciti">Unisciti</a></li>
        <li><a href="accedi.html" class="btn-accedi" id="auth-link" data-i18n="nav_accedi">Accedi</a></li>
        
        <!-- Selettore Lingua -->
        <li>
          <select id="languageSelect" class="lang-selector" onchange="cambiaLingua(this.value)">
            <option value="it">🇮🇹 IT</option>
            <option value="en">🇬🇧 EN</option>
            <option value="fr">🇫🇷 FR</option>
            <option value="es">🇪🇸 ES</option>
          </select>
        </li>
      </ul>
    </nav>
  </header>

  <main class="page-content">
    <div class="join-box">
      <h1 data-i18n="join_title">Unisciti al Circolo</h1>
      <p data-i18n="join_subtitle">Compila il modulo per registrarti e far parte della community.</p>
      
      <form id="register-form">
        <div class="form-group">
          <label for="nome" data-i18n="label_nome">Nome</label>
          <input type="text" id="nome" required placeholder="Il tuo nome">
        </div>

        <div class="form-group">
          <label for="cognome" data-i18n="label_cognome">Cognome</label>
          <input type="text" id="cognome" required placeholder="Il tuo cognome">
        </div>

        <div class="form-group">
          <label for="nickname" data-i18n="label_nickname">Nickname</label>
          <input type="text" id="nickname" required placeholder="Il tuo nickname di gioco/skipper">
        </div>

        <div class="form-group">
          <label for="team" data-i18n="label_team">Team</label>
          <input type="text" id="team" placeholder="Nome del team di appartenenza">
        </div>

        <div class="form-group">
          <label for="email" data-i18n="label_email">Email</label>
          <input type="email" id="email" required placeholder="tuamail@example.com">
        </div>
        
        <div class="form-group">
          <label for="password" data-i18n="label_password">Password</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>
        
        <button type="submit" class="btn-submit" data-i18n="btn_register">Registrati</button>
      </form>

      <div class="auth-footer">
        <span data-i18n="footer_has_account">Hai già un account?</span> <a href="accedi.html" data-i18n="footer_login_link">Accedi qui</a>
      </div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://kisffsyerranniypkcqa.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtpc2Zmc3llcnJhbm5peXBrY3FhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5MTgxMTgsImV4cCI6MjEwNjQ5NDExOH0.1PNoShPUl32yN3aQenRNan_SCTxtKacr_VVwi5uaELs';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const traduzioni = {
      it: {
        nav_home: "Home", nav_team: "Team", nav_gare: "Gare & Eventi ▾", nav_classifiche: "Classifiche",
        nav_albo: "Albo d'Oro", nav_regolamento: "Regolamento", nav_download: "Download",
        nav_contatti: "Contatti", nav_membri: "Membri", nav_unisciti: "Unisciti",
        nav_accedi: "Accedi", nav_area_membri: "Area Membri",
        join_title: "Unisciti al Circolo",
        join_subtitle: "Compila il modulo per registrarti e far parte della community.",
        label_nome: "Nome", label_cognome: "Cognome", label_nickname: "Nickname",
        label_team: "Team", label_email: "Email", label_password: "Password",
        btn_register: "Registrati", footer_has_account: "Hai già un account?",
        footer_login_link: "Accedi qui",
        alert_success: "Registrazione completata con successo! Ora puoi effettuare il login.",
        alert_error: "Errore durante la registrazione: "
      },
      en: {
        nav_home: "Home", nav_team: "Teams", nav_gare: "Races & Events ▾", nav_classifiche: "Standings",
        nav_albo: "Hall of Fame", nav_regolamento: "Rules", nav_download: "Download",
        nav_contatti: "Contact", nav_membri: "Members", nav_unisciti: "Join Us",
        nav_accedi: "Login", nav_area_membri: "Member Area",
        join_title: "Join the Club",
        join_subtitle: "Fill out the form to register and become part of the community.",
        label_nome: "First Name", label_cognome: "Last Name", label_nickname: "Nickname",
        label_team: "Team", label_email: "Email", label_password: "Password",
        btn_register: "Register", footer_has_account: "Already have an account?",
        footer_login_link: "Log in here",
        alert_success: "Registration completed successfully! You can now log in.",
        alert_error: "Error during registration: "
      },
      fr: {
        nav_home: "Accueil", nav_team: "Équipes", nav_gare: "Courses & Événements ▾", nav_classifiche: "Classements",
        nav_albo: "Temple de la Renommée", nav_regolamento: "Règlement", nav_download: "Téléchargements",
        nav_contatti: "Contact", nav_membri: "Membres", nav_unisciti: "Rejoindre",
        nav_accedi: "Connexion", nav_area_membri: "Espace Membre",
        join_title: "Rejoindre le Club",
        join_subtitle: "Remplissez le formulaire pour vous inscrire et faire partie de la communauté.",
        label_nome: "Prénom", label_cognome: "Nom", label_nickname: "Pseudo",
        label_team: "Équipe", label_email: "E-mail", label_password: "Mot de passe",
        btn_register: "S'inscrire", footer_has_account: "Vous avez déjà un compte ?",
        footer_login_link: "Connectez-vous ici",
        alert_success: "Inscription réussie ! Vous pouvez maintenant vous connecter.",
        alert_error: "Erreur lors de l'inscription : "
      },
      es: {
        nav_home: "Inicio", nav_team: "Equipos", nav_gare: "Regatas y Eventos ▾", nav_classifiche: "Clasificación",
        nav_albo: "Salón de la Fama", nav_regolamento: "Reglamento", nav_download: "Descargas",
        nav_contatti: "Contacto", nav_membri: "Miembros", nav_unisciti: "Únete",
        nav_accedi: "Acceder", nav_area_membri: "Área de Miembros",
        join_title: "Únete al Club",
        join_subtitle: "Completa el formulario para registrarte y formar parte de la comunidad.",
        label_nome: "Nombre", label_cognome: "Apellido", label_nickname: "Apodo",
        label_team: "Equipo", label_email: "Correo", label_password: "Contraseña",
        btn_register: "Registrarse", footer_has_account: "¿Ya tienes una cuenta?",
        footer_login_link: "Inicia sesión aquí",
        alert_success: "¡Registro completado con éxito! Ahora puedes iniciar sesión.",
        alert_error: "Error en el registro: "
      }
    };

    let currentLang = localStorage.getItem('cvi_lang') || 'it';
    const langSelect = document.getElementById('languageSelect');
    if (langSelect) langSelect.value = currentLang;

    function cambiaLingua(lang) {
      currentLang = lang;
      localStorage.setItem('cvi_lang', lang);
      
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (traduzioni[lang][key]) {
          el.textContent = traduzioni[lang][key];
        }
      });
      aggiornaTestoAuth();
    }

    async function aggiornaTestoAuth() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      const authLink = document.getElementById('auth-link');
      if (session && authLink) {
        authLink.href = "membri.html";
        authLink.textContent = traduzioni[currentLang]['nav_area_membri'];
      }
    }

    document.getElementById('register-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const t = traduzioni[currentLang];

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const nome = document.getElementById('nome').value;
      const cognome = document.getElementById('cognome').value;
      const nickname = document.getElementById('nickname').value;
      const team = document.getElementById('team').value;

      try {
        const { data, error } = await supabaseClient.auth.signUp({
          email: email,
          password: password,
          options: {
            data: {
              nome: nome,
              cognome: cognome,
              nickname: nickname,
              team: team
            }
          }
        });

        if (error) {
          alert(t.alert_error + error.message);
        } else {
          alert(t.alert_success);
          window.location.href = 'accedi.html';
        }
      } catch (err) {
        alert(t.alert_error + err.message);
      }
    });

    aggiornaTestoAuth();
    cambiaLingua(currentLang);
  </script>
</body>
</html>
