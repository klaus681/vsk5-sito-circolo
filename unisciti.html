<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unisciti - Circolo Velico Italia VSK5</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .page-content {
      padding: 130px 2rem 4rem 2rem;
      max-width: 500px;
      margin: 0 auto;
    }
    .join-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 2.5rem;
      border-radius: 8px;
    }
    .join-box h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      color: #38bdf8;
      text-align: center;
    }
    .join-box > p {
      color: #9ca3af;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 2rem;
      text-align: center;
    }
    .form-group {
      margin-bottom: 1.2rem;
    }
    .form-group label {
      display: block;
      color: #d1d5db;
      margin-bottom: 0.4rem;
      font-size: 0.9rem;
    }
    .form-group input {
      width: 100%;
      padding: 0.8rem;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      color: #fff;
      font-size: 1rem;
    }
    .form-group input:focus {
      outline: none;
      border-color: #38bdf8;
    }
    .btn-submit {
      width: 100%;
      background-color: #0099ff;
      color: #fff;
      padding: 0.8rem;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 1rem;
    }
    .btn-submit:hover {
      background-color: #0077cc;
    }
    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      color: #9ca3af;
      font-size: 0.9rem;
    }
    .auth-footer a {
      color: #38bdf8;
      text-decoration: none;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>

  <!-- Libreria JavaScript di Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header>
    <a href="index.html" class="logo-container">
      <img src="logo-cvi.png" alt="Circolo Velico Italia - VSK5" class="logo-img">
    </a>
    
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="team.html">Team</a></li>
        <li class="dropdown">
          <a href="#">Gare & Eventi ▾</a>
          <ul class="dropdown-menu">
            <li><a href="classifiche.html">Classifiche</a></li>
          </ul>
        </li>
        <li><a href="albo-doro.html">Albo d'Oro</a></li>
        <li><a href="regolamento.html">Regolamento</a></li>
        <li><a href="download.html">Download</a></li>
        <li><a href="contatti.html">Contatti</a></li>
        <li><a href="membri.html">Membri</a></li>
        <li><a href="unisciti.html" class="active btn-unisciti">Unisciti</a></li>
        <li><a href="accedi.html" class="btn-accedi">Accedi</a></li>
      </ul>
    </nav>
  </header>

  <main class="page-content">
    <div class="join-box">
      <h1>Unisciti al Circolo</h1>
      <p>Compila il modulo per registrarti e far parte della community.</p>
      
      <form id="register-form">
        <div class="form-group">
          <label for="nome">Nome</label>
          <input type="text" id="nome" required placeholder="Il tuo nome">
        </div>

        <div class="form-group">
          <label for="cognome">Cognome</label>
          <input type="text" id="cognome" required placeholder="Il tuo cognome">
        </div>

        <div class="form-group">
          <label for="nickname">Nickname</label>
          <input type="text" id="nickname" required placeholder="Il tuo nickname di gioco/skipper">
        </div>

        <div class="form-group">
          <label for="team">Team</label>
          <input type="text" id="team" placeholder="Nome del team di appartenenza">
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="tuamail@example.com">
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>
        
        <button type="submit" class="btn-submit">Registrati</button>
      </form>

      <div class="auth-footer">
        Hai già un account? <a href="accedi.html">Accedi qui</a>
      </div>
    </div>
  </main>

  <script>
    // Inserisci le tue chiavi reali di Supabase
    const SUPABASE_URL = 'https://kisffsyerranniypkcqa.supabase.co/rest/v1/';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtpc2Zmc3llcnJhbm5peXBrY3FhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5MTgxMTgsImV4cCI6MjEwNjQ5NDExOH0.1PNoShPUl32yN3aQenRNan_SCTxtKacr_VVwi5uaELs';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const registerForm = document.getElementById('register-form');
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const nome = document.getElementById('nome').value;
      const cognome = document.getElementById('cognome').value;
      const nickname = document.getElementById('nickname').value;
      const team = document.getElementById('team').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      // 1. Registrazione con Supabase Auth salvando i dati extra in options.data
      const { data, error } = await supabaseClient.auth.signUp({
        email: email,
        password: password,
        options: {
          data: {
            nome: nome,
            cognome: cognome,
            nickname: nickname,
            team: team
          }
        }
      });

      if (error) {
        alert("Errore durante la registrazione: " + error.message);
      } else {
        alert("Registrazione completata con successo! Ora puoi effettuare il login.");
        window.location.href = "accedi.html";
      }
    });
  </script>

</body>
</html>
