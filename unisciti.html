<!DOCTYPE html>

  <title>Unisciti - Circolo Velico Italia VSK5</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .page-content {
      padding: 130px 2rem 4rem 2rem;
      max-width: 500px;
      margin: 0 auto;
    }
    .join-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 2.5rem;
      border-radius: 8px;
    }
    .join-box h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      color: #38bdf8;
      text-align: center;
    }
    .join-box > p {
      color: #9ca3af;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 2rem;
      text-align: center;
    }
    .form-group {
      margin-bottom: 1.2rem;
    }
    .form-group label {
      display: block;
      color: #d1d5db;
      margin-bottom: 0.4rem;
      font-size: 0.9rem;
    }
    .form-group input {
      width: 100%;
      padding: 0.8rem;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      color: #fff;
      font-size: 1rem;
    }
    .form-group input:focus {
      outline: none;
      border-color: #38bdf8;
    }
    .btn-submit {
      width: 100%;
      background-color: #0099ff;
      color: #fff;
      padding: 0.8rem;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 1rem;
    }
    .btn-submit:hover {
      background-color: #0077cc;
    }
    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      color: #9ca3af;
      font-size: 0.9rem;
    }
    .auth-footer a {
      color: #38bdf8;
      text-decoration: none;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
    /* Stile per il selettore della lingua nel menu */
    .lang-selector {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }
  </style>

  <!-- Libreria JavaScript di Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

        </li>
        <li><a href="albo-doro.html" data-i18n="nav_albo">Albo d'Oro</a></li>
        <li><a href="regolamento.html" data-i18n="nav_regolamento">Regolamento</a></li>
        <li><a href="download.html" data-i18n="nav_download">Download</a></li>
        <li><a href="contatti.html" data-i18n="nav_contatti">Contatti</a></li>
        <li><a href="membri.html" data-i18n="nav_membri">Membri</a></li>
        <li><a href="unisciti.html" class="active btn-unisciti" data-i18n="nav_unisciti">Unisciti</a></li>
        <li><a href="accedi.html" class="btn-accedi" id="auth-link" data-i18n="nav_accedi">Accedi</a></li>
        
        <!-- Selettore Lingua -->
        <li>
          <select id="languageSelect" class="lang-selector" onchange="cambiaLingua(this.value)">
            <option value="it">🇮🇹 IT</option>
            <option value="en">🇬🇧 EN</option>
            <option value="fr">🇫🇷 FR</option>
            <option value="es">🇪🇸 ES</option>
          </select>
        </li>
      </ul>
    </nav>
  </header>

  <main class="page-content">
    <div class="join-box">
      <h1 data-i18n="join_title">Unisciti al Circolo</h1>
      <p data-i18n="join_subtitle">Compila il modulo per registrarti e far parte della community.</p>
      
      <form id="register-form">
        <div class="form-group">
          <label for="nome" data-i18n="label_nome">Nome</label>
          <input type="text" id="nome" required placeholder="Il tuo nome" data-i18n-placeholder="ph_nome">
        </div>

        <div class="form-group">
          <label for="cognome" data-i18n="label_cognome">Cognome</label>
          <input type="text" id="cognome" required placeholder="Il tuo cognome" data-i18n-placeholder="ph_cognome">
        </div>

        <div class="form-group">
          <label for="nickname" data-i18n="label_nickname">Nickname</label>
          <input type="text" id="nickname" required placeholder="Il tuo nickname di gioco/skipper" data-i18n-placeholder="ph_nickname">
        </div>

        <div class="form-group">
          <label for="team" data-i18n="label_team">Team</label>
          <input type="text" id="team" placeholder="Nome del team di appartenenza" data-i18n-placeholder="ph_team">
        </div>

        <div class="form-group">
          <label for="email" data-i18n="label_email">Email</label>
          <input type="email" id="email" required placeholder="tuamail@example.com" data-i18n-placeholder="ph_email">
        </div>
        
        <div class="form-group">
          <label for="password" data-i18n="label_password">Password</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>
        
        <button type="submit" class="btn-submit" data-i18n="btn_register">Registrati</button>
      </form>

      <div class="auth-footer">
        <span data-i18n="footer_has_account">Hai già un account?</span> <a href="accedi.html" data-i18n="footer_login_link">Accedi qui</a>
      </div>
    </div>
  </main>
