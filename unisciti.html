    let currentLang = localStorage.getItem('cvi_lang') || 'it';
    const langSelect = document.getElementById('languageSelect');
    if (langSelect) langSelect.value = currentLang;

    function cambiaLingua(lang) {
      currentLang = lang;
      localStorage.setItem('cvi_lang', lang);
      
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (traduzioni[lang][key]) {
          el.textContent = traduzioni[lang][key];
        }
      });

      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        if (traduzioni[lang][key]) {
          el.placeholder = traduzioni[lang][key];
        }
      });

      aggiornaTestoAuth();
    }

    async function aggiornaTestoAuth() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      const authLink = document.getElementById('auth-link');
      if (session && authLink) {
        authLink.href = "membri.html";
        authLink.textContent = traduzioni[currentLang]['nav_area_membri'];
      }
    }

    const registerForm = document.getElementById('register-form');
    if (registerForm) {
      registerForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const nome = document.getElementById('nome').value;
        const cognome = document.getElementById('cognome').value;
        const nickname = document.getElementById('nickname').value;
        const team = document.getElementById('team').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        const { data, error } = await supabaseClient.auth.signUp({
          email: email,
          password: password,
          options: {
            data: {
              nome: nome,
              cognome: cognome,
              nickname: nickname,
              team: team
            }
          }
        });

        if (error) {
          alert(traduzioni[currentLang]['alert_error'] + error.message);
        } else {
          alert(traduzioni[currentLang]['alert_success']);
          window.location.href = "accedi.html";
        }
      });
    }

    aggiornaTestoAuth();
    cambiaLingua(currentLang);
  </script>
