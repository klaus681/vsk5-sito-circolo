<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soci Iscritti - Circolo Velico Italia VSK5</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .page-content {
      padding: 130px 2rem 4rem 2rem;
      max-width: 900px;
      margin: 0 auto;
    }
    .members-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 2.5rem;
      border-radius: 8px;
    }
    .members-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .members-box h1 {
      font-size: 2rem;
      text-transform: uppercase;
      color: #38bdf8;
      margin: 0;
    }
    .btn-logout {
      background-color: #ef4444;
      color: #fff;
      padding: 0.6rem 1.2rem;
      border: none;
      border-radius: 4px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-logout:hover {
      background-color: #dc2626;
    }
    table.members-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 6px;
      overflow: hidden;
    }
    table.members-table th, 
    table.members-table td {
      padding: 1rem;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      color: #d1d5db;
    }
    table.members-table th {
      background: rgba(56, 189, 248, 0.1);
      color: #38bdf8;
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
    }
    table.members-table tr:last-child td {
      border-bottom: none;
    }
    table.members-table tr:hover td {
      background: rgba(255, 255, 255, 0.02);
      color: #fff;
    }
    .loading-text, .empty-text {
      text-align: center;
      color: #9ca3af;
      padding: 2rem;
      font-style: italic;
    }
    .lang-selector {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }
  </style>

  <!-- Libreria JavaScript di Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header>
    <a href="index.html" class="logo-container">
      <img src="logo-cvi.png" alt="Circolo Velico Italia - VSK5" class="logo-img">
    </a>
    
    <nav>
      <ul id="nav-menu">
        <li><a href="index.html" data-i18n="nav_home">Home</a></li>
        <li><a href="team.html" data-i18n="nav_team">Team</a></li>
        <li class="dropdown">
          <a href="#" data-i18n="nav_gare">Gare & Eventi ▾</a>
          <ul class="dropdown-menu">
            <li><a href="classifiche.html" data-i18n="nav_classifiche">Classifiche</a></li>
          </ul>
        </li>
        <li><a href="albo-doro.html" data-i18n="nav_albo">Albo d'Oro</a></li>
        <li><a href="regolamento.html" data-i18n="nav_regolamento">Regolamento</a></li>
        <li><a href="download.html" data-i18n="nav_download">Download</a></li>
        <li><a href="contatti.html" data-i18n="nav_contatti">Contatti</a></li>
        <li><a href="membri.html" class="active" data-i18n="nav_membri">Membri</a></li>
        <li><a href="unisciti.html" class="btn-unisciti" data-i18n="nav_unisciti">Unisciti</a></li>
        <li><a href="accedi.html" class="btn-accedi" id="auth-link" data-i18n="nav_accedi">Accedi</a></li>
        
        <!-- Selettore Lingua -->
        <li>
          <select id="languageSelect" class="lang-selector" onchange="cambiaLingua(this.value)">
            <option value="it">🇮🇹 IT</option>
            <option value="en">🇬🇧 EN</option>
            <option value="fr">🇫🇷 FR</option>
            <option value="es">🇪🇸 ES</option>
          </select>
        </li>
      </ul>
    </nav>
  </header>

  <main class="page-content">
    <div class="members-box">
      <div class="members-header">
        <h1 data-i18n="members_title">Albo Soci Iscritti</h1>
        <button id="logout-btn" class="btn-logout" data-i18n="btn_logout">Disconnetti</button>
      </div>
      <p style="color: #9ca3af; margin-bottom: 1.5rem;" data-i18n="members_subtitle">Elenco ufficiale dei membri registrati al Circolo Velico.</p>
      
      <div id="members-container">
        <p class="loading-text" data-i18n="members_loading">Caricamento elenco soci in corso...</p>
      </div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://kisffsyerranniypkcqa.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtpc2Zmc3llcnJhbm5peXBrY3FhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5MTgxMTgsImV4cCI6MjEwNjQ5NDExOH0.1PNoShPUl32yN3aQenRNan_SCTxtKacr_VVwi5uaELs';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const traduzioni = {
      it: {
        nav_home: "Home",
        nav_team: "Team",
        nav_gare: "Gare & Eventi ▾",
        nav_classifiche: "Classifiche",
        nav_albo: "Albo d'Oro",
        nav_regolamento: "Regolamento",
        nav_download: "Download",
        nav_contatti: "Contatti",
        nav_membri: "Membri",
        nav_unisciti: "Unisciti",
        nav_accedi: "Accedi",
        nav_area_membri: "Area Membri",
        members_title: "Albo Soci Iscritti",
        members_subtitle: "Elenco ufficiale dei membri registrati al Circolo Velico.",
        members_loading: "Caricamento elenco soci in corso...",
        members_empty: "Nessun socio iscritto al momento.",
        btn_logout: "Disconnetti",
        th_name: "Nome",
        th_nickname: "Nickname",
        th_team: "Team",
        no_team: "Nessun team",
        alert_auth_required: "Devi effettuare l'accesso per visualizzare l'elenco dei soci.",
        alert_logout_error: "Errore durante la disconnessione: "
      },
      en: {
        nav_home: "Home",
        nav_team: "Teams",
        nav_gare: "Races & Events ▾",
        nav_classifiche: "Standings",
        nav_albo: "Hall of Fame",
        nav_regolamento: "Rules",
        nav_download: "Download",
        nav_contatti: "Contact",
        nav_membri: "Members",
        nav_unisciti: "Join Us",
        nav_accedi: "Login",
        nav_area_membri: "Member Area",
        members_title: "Registered Members Roster",
        members_subtitle: "Official list of members registered at the Sailing Club.",
        members_loading: "Loading members roster...",
        members_empty: "No members registered at the moment.",
        btn_logout: "Sign Out",
        th_name: "Name",
        th_nickname: "Nickname",
        th_team: "Team",
        no_team: "No team",
        alert_auth_required: "You must log in to view the members roster.",
        alert_logout_error: "Error during sign out: "
      },
      fr: {
        nav_home: "Accueil",
        nav_team: "Équipes",
        nav_gare: "Courses & Événements ▾",
        nav_classifiche: "Classements",
        nav_albo: "Temple de la Renommée",
        nav_regolamento: "Règlement",
        nav_download: "Téléchargements",
        nav_contatti: "Contact",
        nav_membri: "Membres",
        nav_unisciti: "Rejoindre",
        nav_accedi: "Connexion",
        nav_area_membri: "Espace Membre",
        members_title: "Registre des Membres",
        members_subtitle: "Liste officielle des membres inscrits au Club Nautique.",
        members_loading: "Chargement de la liste des membres...",
        members_empty: "Aucun membre inscrit pour le moment.",
        btn_logout: "Déconnexion",
        th_name: "Nom",
        th_nickname: "Pseudo",
        th_team: "Équipe",
        no_team: "Aucune équipe",
        alert_auth_required: "Vous devez vous connecter pour afficher la liste des membres.",
        alert_logout_error: "Erreur lors de la déconnexion : "
      },
      es: {
        nav_home: "Inicio",
        nav_team: "Equipos",
        nav_gare: "Regatas y Eventos ▾",
        nav_classifiche: "Clasificación",
        nav_albo: "Salón de la Fama",
        nav_regolamento: "Reglamento",
        nav_download: "Descargas",
        nav_contatti: "Contacto",
        nav_membri: "Miembros",
        nav_unisciti: "Únete",
        nav_accedi: "Acceder",
        nav_area_membri: "Área de Miembros",
        members_title: "Registro de Miembros Inscritos",
        members_subtitle: "Lista oficial de los miembros registrados en el Club Náutico.",
        members_loading: "Cargando lista de miembros...",
        members_empty: "No hay miembros inscritos en este momento.",
        btn_logout: "Cerrar sesión",
        th_name: "Nombre",
        th_nickname: "Apodo",
        th_team: "Equipo",
        no_team: "Sin equipo",
        alert_auth_required: "Debes iniciar sesión para ver la lista de miembros.",
        alert_logout_error: "Error al cerrar sesión: "
      }
    };

    let currentLang = localStorage.getItem('cvi_lang') || 'it';
    const langSelect = document.getElementById('languageSelect');
    if (langSelect) langSelect.value = currentLang;

    let cachedProfiles = [];

    function cambiaLingua(lang) {
      currentLang = lang;
      localStorage.setItem('cvi_lang', lang);
      
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (traduzioni[lang][key]) {
          el.textContent = traduzioni[lang][key];
        }
      });

      aggiornaTestoAuth();

      if (cachedProfiles.length > 0) {
        renderizzaTabellaSoci(cachedProfiles);
      }
    }

    async function aggiornaTestoAuth() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      const authLink = document.getElementById('auth-link');
      if (session && authLink) {
        authLink.href = "membri.html";
        authLink.textContent = traduzioni[currentLang]['nav_area_membri'];
      }
    }

    async function initMembersPage() {
      // 1. Controllo di autenticazione: se non è loggato, reindirizza al login
      const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();

      if (sessionError || !session) {
        alert(traduzioni[currentLang]['alert_auth_required']);
        window.location.href = "accedi.html";
        return;
      }

      // 2. Carica i dati dalla tabella profiles
      const container = document.getElementById('members-container');
      const { data: profiles, error: profileError } = await supabaseClient
        .from('profiles')
        .select('*');

      if (profileError) {
        container.innerHTML = `<p class="empty-text" style="color: #ef4444;">Errore nel caricamento dei soci: ${profileError.message}</p>`;
        return;
      }

      if (!profiles || profiles.length === 0) {
        container.innerHTML = `<p class="empty-text">${traduzioni[currentLang]['members_empty']}</p>`;
        return;
      }

      cachedProfiles = profiles;
      renderizzaTabellaSoci(cachedProfiles);
    }

    function renderizzaTabellaSoci(profiles) {
      const container = document.getElementById('members-container');
      const t = traduzioni[currentLang];

      let html = `
        <table class="members-table">
          <thead>
            <tr>
              <th>${t.th_name}</th>
              <th>${t.th_nickname}</th>
              <th>${t.th_team}</th>
            </tr>
          </thead>
          <tbody>
      `;

      profiles.forEach(profile => {
        const fullName = `${profile.nome || ''} ${profile.cognome || ''}`.trim() || profile.email || 'Socio';
        const nickname = profile.nickname || '-';
        const team = profile.team || t.no_team;

        html += `
          <tr>
            <td>${fullName}</td>
            <td>${nickname}</td>
            <td>${team}</td>
          </tr>
        `;
      });

      html += `
          </tbody>
        </table>
      `;

      container.innerHTML = html;
    }

    // Gestione Logout
    const logoutBtn = document.getElementById('logout-btn');
    if (logoutBtn) {
      logoutBtn.addEventListener('click', async () => {
        const { error } = await supabaseClient.auth.signOut();
        if (error) {
          alert(traduzioni[currentLang]['alert_logout_error'] + error.message);
        } else {
          window.location.href = "accedi.html";
        }
      });
    }

    aggiornaTestoAuth();
    cambiaLingua(currentLang);
    initMembersPage();
  </script>

</body>
</html>
