<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Albo d'Oro - Circolo Velico Italia VSK5</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .page-content {
      padding: 130px 2rem 4rem 2rem;
      max-width: 1000px;
      margin: 0 auto;
    }
    .albo-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 2.5rem;
      border-radius: 8px;
    }
    .albo-box h1 {
      font-size: 2rem;
      text-transform: uppercase;
      color: #38bdf8;
      margin-bottom: 0.5rem;
    }
    table.results-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 2rem;
      text-align: left;
    }
    table.results-table th, table.results-table td {
      padding: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      color: #fff;
    }
    table.results-table th {
      background: rgba(56, 189, 248, 0.1);
      color: #38bdf8;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    table.results-table tr:hover {
      background: rgba(255, 255, 255, 0.02);
    }
    .loading-text, .empty-text {
      text-align: center;
      color: #9ca3af;
      padding: 2rem;
      font-style: italic;
    }
  </style>

  <!-- Libreria JavaScript di Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header>
    <a href="index.html" class="logo-container">
      <img src="logo-cvi.png" alt="Circolo Velico Italia - VSK5" class="logo-img">
    </a>
    
    <nav>
      <ul id="nav-menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="team.html">Team</a></li>
        
        <li class="dropdown">
          <a href="gare.html">Gare & Eventi ▾</a>
          <ul class="dropdown-menu">
            <li><a href="gare.html">Gare</a></li>
            <li><a href="classifiche.html">Classifiche</a></li>
          </ul>
        </li>

        <li><a href="albo-doro.html" class="active">Albo d'Oro</a></li>
        <li><a href="regolamento.html">Regolamento</a></li>
        <li><a href="download.html">Download</a></li>
        <li><a href="contatti.html">Contatti</a></li>
        <li><a href="membri.html">Membri</a></li>
        <li><a href="unisciti.html" class="btn-unisciti">Unisciti</a></li>
        <li><a href="accedi.html" class="btn-accedi" id="auth-link">Accedi</a></li>
      </ul>
    </nav>
  </header>

  <main class="page-content">
    <div class="albo-box">
      <h1>Albo d'Oro</h1>
      <p style="color: #9ca3af; margin-bottom: 2rem;">I trionfi e i vincitori delle competizioni storiche del Circolo Velico Italia.</p>
      
      <div id="albo-container">
        <p class="loading-text">Caricamento albo d'oro in corso...</p>
      </div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://kisffsyerranniypkcqa.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtpc2Zmc3llcnJhbm5peXBrY3FhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5MTgxMTgsImV4cCI6MjEwNjQ5NDExOH0.1PNoShPUl32yN3aQenRNan_SCTxtKacr_VVwi5uaELs';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function checkNavAuth() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      const authLink = document.getElementById('auth-link');
      if (session && authLink) {
        authLink.href = "membri.html";
        authLink.textContent = "Area Membri";
      }
    }

    async function loadAlboDoro() {
      const container = document.getElementById('albo-container');

      // Interroga la tabella "albo_doro" su Supabase
      const { data: vincitori, error } = await supabaseClient
        .from('albo_doro')
        .select('*');

      if (error) {
        container.innerHTML = `<p class="empty-text" style="color: #ef4444;">Errore nel caricamento dell'albo d'oro: ${error.message}</p>`;
        return;
      }

      if (!vincitori || vincitori.length === 0) {
        container.innerHTML = `<p class="empty-text">Nessun record presente nell'albo d'oro al momento.</p>`;
        return;
      }

      let tableHtml = `
        <table class="results-table">
          <thead>
            <tr>
              <th>Skipper Vincitore</th>
              <th>Nome Gara</th>
              <th>Data Gara</th>
            </tr>
          </thead>
          <tbody>
      `;

      vincitori.forEach(item => {
        // Gestiamo eventuali variazioni nei nomi delle colonne (es. skipper, nome_gara/gara, data_gara/data)
        const skipper = item.skipper || item.nome_skipper || '-';
        const nomeGara = item.nome_gara || item.gara || item.titolo || '-';
        const dataGara = item.data_gara || item.data || '-';

        tableHtml += `
          <tr>
            <td style="font-weight: bold; color: #38bdf8;">${skipper}</td>
            <td>${nomeGara}</td>
            <td>${dataGara}</td>
          </tr>
        `;
      });

      tableHtml += `</tbody></table>`;
      container.innerHTML = tableHtml;
    }

    checkNavAuth();
    loadAlboDoro();
  </script>

</body>
</html>
