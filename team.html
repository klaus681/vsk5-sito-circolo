<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team & Equipaggi - Circolo Velico Italia VSK5</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .page-content {
      padding: 130px 2rem 4rem 2rem;
      max-width: 1000px;
      margin: 0 auto;
    }
    .team-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 2.5rem;
      border-radius: 8px;
    }
    .team-box h1 {
      font-size: 2rem;
      text-transform: uppercase;
      color: #38bdf8;
      margin-bottom: 0.5rem;
    }
    .teams-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }
    .team-card {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-top: 4px solid #38bdf8;
      padding: 1.8rem;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .team-card h3 {
      color: #fff;
      font-size: 1.5rem;
      margin-bottom: 0.2rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .team-captain-badge {
      display: inline-block;
      color: #38bdf8;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 1rem;
    }
    .team-card p {
      color: #9ca3af;
      font-size: 0.95rem;
      margin: 0 0 1.2rem 0;
      line-height: 1.5;
    }
    .team-members-section {
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 1rem;
      margin-top: auto;
    }
    .team-members-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      color: #38bdf8;
      font-weight: 600;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .members-list {
      list-style: none;
      padding: 0;
      margin: 0;
      color: #e2e8f0;
      font-size: 0.9rem;
    }
    .members-list li {
      padding: 0.2rem 0;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.05);
    }
    .members-list li:last-child {
      border-bottom: none;
    }
    .no-members {
      color: #6b7280;
      font-style: italic;
      font-size: 0.85rem;
    }
    .loading-text, .empty-text {
      text-align: center;
      color: #9ca3af;
      padding: 2rem;
      font-style: italic;
      grid-column: 1 / -1;
    }
    .lang-selector {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }
  </style>

  <!-- Libreria JavaScript di Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header>
    <a href="index.html" class="logo-container">
      <img src="logo-cvi.png" alt="Circolo Velico Italia - VSK5" class="logo-img">
    </a>
    
    <nav>
      <ul id="nav-menu">
        <li><a href="index.html" data-i18n="nav_home">Home</a></li>
        <li><a href="team.html" class="active" data-i18n="nav_team">Team</a></li>
        
        <li class="dropdown">
          <a href="gare.html" data-i18n="nav_gare">Gare & Eventi ▾</a>
          <ul class="dropdown-menu">
            <li><a href="gare.html" data-i18n="nav_gare_sub">Gare</a></li>
            <li><a href="classifiche.html" data-i18n="nav_classifiche">Classifiche</a></li>
          </ul>
        </li>

        <li><a href="albo-doro.html" data-i18n="nav_albo">Albo d'Oro</a></li>
        <li><a href="regolamento.html" data-i18n="nav_regolamento">Regolamento</a></li>
        <li><a href="download.html" data-i18n="nav_download">Download</a></li>
        <li><a href="contatti.html" data-i18n="nav_contatti">Contatti</a></li>
        <li><a href="membri.html" data-i18n="nav_membri">Membri</a></li>
        <li><a href="unisciti.html" class="btn-unisciti" data-i18n="nav_unisciti">Unisciti</a></li>
        <li><a href="accedi.html" class="btn-accedi" id="auth-link" data-i18n="nav_accedi">Accedi</a></li>
        
        <!-- Selettore Lingua -->
        <li>
          <select id="languageSelect" class="lang-selector" onchange="cambiaLingua(this.value)">
            <option value="it">🇮🇹 IT</option>
            <option value="en">🇬🇧 EN</option>
            <option value="fr">🇫🇷 FR</option>
            <option value="es">🇪🇸 ES</option>
          </select>
        </li>
      </ul>
    </nav>
  </header>

  <main class="page-content">
    <div class="team-box">
      <h1 data-i18n="team_title">Team & Equipaggi</h1>
      <p style="color: #9ca3af; margin-bottom: 2rem;" data-i18n="team_subtitle">Le squadre ufficiali del Circolo Velico Italia e i relativi equipaggi.</p>
      
      <div id="teams-container" class="teams-grid">
        <p class="loading-text" data-i18n="team_loading">Caricamento team in corso...</p>
      </div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://kisffsyerranniypkcqa.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtpc2Zmc3llcnJhbm5peXBrY3FhIiwicm9sZSI6ImFub24i lànOjE3OTA5MTgxMTgsImV4cCI6MjEwNjQ5NDExOH0.1PNoShPUl32yN3aQenRNan_SCTxtKacr_VVwi5uaELs';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Dizionario delle traduzioni
    const traduzioni = {
      it: {
        nav_home: "Home",
        nav_team: "Team",
        nav_gare: "Gare & Eventi ▾",
        nav_gare_sub: "Gare",
        nav_classifiche: "Classifiche",
        nav_albo: "Albo d'Oro",
        nav_regolamento: "Regolamento",
        nav_download: "Download",
        nav_contatti: "Contatti",
        nav_membri: "Membri",
        nav_unisciti: "Unisciti",
        nav_accedi: "Accedi",
        nav_area_membri: "Area Membri",
        team_title: "Team & Equipaggi",
        team_subtitle: "Le squadre ufficiali del Circolo Velico Italia e i relativi equipaggi.",
        team_loading: "Caricamento team in corso...",
        team_empty: "Nessun team registrato al momento.",
        captain_label: "⚓ Capitano: ",
        members_label: "Membri",
        no_members: "Nessun membro iscritto a questo team.",
        no_desc: "Nessuna descrizione disponibile."
      },
      en: {
        nav_home: "Home",
        nav_team: "Teams",
        nav_gare: "Races & Events ▾",
        nav_gare_sub: "Races",
        nav_classifiche: "Standings",
        nav_albo: "Hall of Fame",
        nav_regolamento: "Rules",
        nav_download: "Download",
        nav_contatti: "Contact",
        nav_membri: "Members",
        nav_unisciti: "Join Us",
        nav_accedi: "Login",
        nav_area_membri: "Member Area",
        team_title: "Teams & Crews",
        team_subtitle: "Official teams of Circolo Velico Italia and their respective crews.",
        team_loading: "Loading teams...",
        team_empty: "No teams registered at the moment.",
        captain_label: "⚓ Captain: ",
        members_label: "Members",
        no_members: "No members registered in this team.",
        no_desc: "No description available."
      },
      fr: {
        nav_home: "Accueil",
        nav_team: "Équipes",
        nav_gare: "Courses & Événements ▾",
        nav_gare_sub: "Courses",
        nav_classifiche: "Classements",
        nav_albo: "Temple de la Renommée",
        nav_regolamento: "Règlement",
        nav_download: "Téléchargements",
        nav_contatti: "Contact",
        nav_membri: "Membres",
        nav_unisciti: "Rejoindre",
        nav_accedi: "Connexion",
        nav_area_membri: "Espace Membre",
        team_title: "Équipes & Équipages",
        team_subtitle: "Les équipes officielles du Circolo Velico Italia et leurs équipages.",
        team_loading: "Chargement des équipes...",
        team_empty: "Aucune équipe enregistrée pour le moment.",
        captain_label: "⚓ Capitaine : ",
        members_label: "Membres",
        no_members: "Aucun membre inscrit dans cette équipe.",
        no_desc: "Aucune description disponible."
      },
      es: {
        nav_home: "Inicio",
        nav_team: "Equipos",
        nav_gare: "Regatas y Eventos ▾",
        nav_gare_sub: "Regatas",
        nav_classifiche: "Clasificación",
        nav_albo: "Salón de la Fama",
        nav_regolamento: "Reglamento",
        nav_download: "Descargas",
        nav_contatti: "Contacto",
        nav_membri: "Miembros",
        nav_unisciti: "Únete",
        nav_accedi: "Acceder",
        nav_area_membri: "Área de Miembros",
        team_title: "Equipos y Tripulaciones",
        team_subtitle: "Los equipos oficiales del Circolo Velico Italia y sus respectivas tripulaciones.",
        team_loading: "Cargando equipos...",
        team_empty: "No hay equipos registrados en este momento.",
        captain_label: "⚓ Capitán: ",
        members_label: "Miembros",
        no_members: "No hay miembros inscritos en este equipo.",
        no_desc: "No hay descripción disponible."
      }
    };

    let currentLang = localStorage.getItem('cvi_lang') || 'it';
    const langSelect = document.getElementById('languageSelect');
    if (langSelect) langSelect.value = currentLang;

    let cachedTeams = [];
    let cachedProfiles = [];

    function cambiaLingua(lang) {
      currentLang = lang;
      localStorage.setItem('cvi_lang', lang);
      
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (traduzioni[lang][key]) {
          el.textContent = traduzioni[lang][key];
        }
      });

      aggiornaTestoAuth();

      if (cachedTeams.length > 0) {
        renderizzaTeams(cachedTeams, cachedProfiles);
      }
    }

    async function aggiornaTestoAuth() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      const authLink = document.getElementById('auth-link');
      if (session && authLink) {
        authLink.href = "membri.html";
        authLink.textContent = traduzioni[currentLang]['nav_area_membri'];
      }
    }

    async function loadTeamsWithMembers() {
      const container = document.getElementById('teams-container');

      // 1. Carica i team dalla tabella "teams" (mantenendo la logica originale esatta)
      const { data: teams, error: teamError } = await supabaseClient
        .from('teams')
        .select('*');

      if (teamError) {
        container.innerHTML = `<p class="empty-text" style="color: #ef4444;">Errore nel caricamento dei team: ${teamError.message}</p>`;
        return;
      }

      if (!teams || teams.length === 0) {
        container.innerHTML = `<p class="empty-text">${traduzioni[currentLang]['team_empty']}</p>`;
        return;
      }

      // 2. Carica i profili dalla tabella "profiles"
      const { data: profiles, error: profileError } = await supabaseClient
        .from('profiles')
        .select('*');

      cachedTeams = teams;
      cachedProfiles = profileError ? [] : (profiles || []);

      renderizzaTeams(cachedTeams, cachedProfiles);
    }

    function renderizzaTeams(teams, allProfiles) {
      const container = document.getElementById('teams-container');
      const t = traduzioni[currentLang];
      let htmlContent = '';

      teams.forEach(team => {
        const teamName = team.nome_team || team.nome || '';
        const captainName = team.capitano || team.skipper || '';
        
        const teamMembers = allProfiles.filter(p => p.team && p.team.trim().toLowerCase() === teamName.trim().toLowerCase());
        const memberCount = teamMembers.length;

        let membersHtml = '';
        if (memberCount > 0) {
          membersHtml += `<ul class="members-list">`;
          teamMembers.forEach(member => {
            let displayName = '';
            if (member.nome) {
              displayName = member.nome.trim();
            }
            if (member.nickname) {
              displayName += displayName ? ` (${member.nickname.trim()})` : member.nickname.trim();
            }
            if (!displayName) {
              displayName = member.email || 'Membro';
            }

            membersHtml += `<li>${displayName}</li>`;
          });
          membersHtml += `</ul>`;
        } else {
          membersHtml += `<span class="no-members">${t.no_members}</span>`;
        }

        const captainHtml = captainName ? `<span class="team-captain-badge">${t.captain_label}${captainName}</span>` : '';
        const descrizione = team.descrizione || t.no_desc;

        htmlContent += `
          <div class="team-card">
            <div>
              <h3>${teamName}</h3>
              ${captainHtml}
              <p>${descrizione}</p>
            </div>
            <div class="team-members-section">
              <div class="team-members-title">
                <span>${t.members_label}</span>
                <span style="background: rgba(56, 189, 248, 0.2); color: #38bdf8; padding: 0.1rem 0.5rem; border-radius: 4px; font-size: 0.75rem;">${memberCount}</span>
              </div>
              ${membersHtml}
            </div>
          </div>
        `;
      });

      container.innerHTML = htmlContent;
    }

    aggiornaTestoAuth();
    loadTeamsWithMembers();
    cambiaLingua(currentLang);
  </script>

</body>
</html>
