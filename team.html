  <style>
    .page-content {
      padding: 130px 2rem 4rem 2rem;
      max-width: 1000px;
      margin: 0 auto;
    }
    .team-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 2.5rem;
      border-radius: 8px;
    }
    .team-box h1 {
      font-size: 2rem;
      text-transform: uppercase;
      color: #38bdf8;
      margin-bottom: 0.5rem;
    }
    .teams-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }
    .team-card {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-top: 4px solid #38bdf8;
      padding: 1.8rem;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .team-card h3 {
      color: #fff;
      font-size: 1.5rem;
      margin-bottom: 0.2rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .team-captain-badge {
      display: inline-block;
      color: #38bdf8;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 1rem;
    }
    .team-card p {
      color: #9ca3af;
      font-size: 0.95rem;
      margin: 0 0 1.2rem 0;
      line-height: 1.5;
    }
    .team-members-section {
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 1rem;
      margin-top: auto;
    }
    .team-members-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      color: #38bdf8;
      font-weight: 600;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .members-list {
      list-style: none;
      padding: 0;
      margin: 0;
      color: #e2e8f0;
      font-size: 0.9rem;
    }
    .members-list li {
      padding: 0.2rem 0;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.05);
    }
    .members-list li:last-child {
      border-bottom: none;
    }
    .no-members {
      color: #6b7280;
      font-style: italic;
      font-size: 0.85rem;
    }
    .loading-text, .empty-text {
      text-align: center;
      color: #9ca3af;
      padding: 2rem;
      font-style: italic;
      grid-column: 1 / -1;
    }
    /* Stile per il selettore della lingua nel menu */
    .lang-selector {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
