name: fix-nav-live
on:
  push:
    paths:
      - '.github/workflows/fix-nav-live.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix broken nav
        run: |
          python3 << 'END'
          from pathlib import Path
          for name in ['index.html', 'gare.html']:
              p = Path(name)
              t = p.read_text(encoding='utf-8')
              t2 = t.replace(
                  '<a href="classifiche.html" href="live.html">Live</a></li>',
                  '<a href="live.html">Live</a></li>',
              )
              t2 = t2.replace(
                  '<li><a href="classifiche.html" href="live.html">Live</a></li>',
                  '<li><a href="live.html">Live</a></li>',
              )
              # ensure a proper Classifiche li still exists after Live
              if 'href="live.html">Live</a></li>' in t2 and 'data-i18n="nav_classifiche">Classifiche</a></li>' not in t2.split('href="live.html">Live</a></li>',1)[1][:200]:
                  t2 = t2.replace(
                      '<li><a href="live.html">Live</a></li>',
                      '<li><a href="live.html">Live</a></li>\n            <li><a href="classifiche.html" data-i18n="nav_classifiche">Classifiche</a></li>',
                      1,
                  )
              if t2 != t:
                  p.write_text(t2, encoding='utf-8')
                  print(name, 'fixed')
              else:
                  print(name, 'no change needed or pattern different')
                  # show context
                  idx = t.find('live.html')
                  if idx >= 0:
                      print(repr(t[max(0,idx-40):idx+60]))
          END
          git config user.name klaus681
          git config user.email klaus68@hotmail.it
          git add index.html gare.html
          git commit -m "Fix Live menu link" || echo none
          git push
