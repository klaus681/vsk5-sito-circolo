name: run-patch-live
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_live.py'
      - '.github/workflows/run-patch-live.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run patch
        run: |
          python3 scripts/patch_live.py
          git config user.name klaus681
          git config user.email klaus68@hotmail.it
          git add index.html index-inline.js gare.html
          git status
          git diff --cached --stat
          git diff --cached --quiet || git commit -m "Live: badge LIVE, Segui LIVE, voce menu"
          git push
