name: live-final
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/live-final.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Python patch
        run: |
          python3 << 'END'
          from pathlib import Path
          import re

          # --- index.html ---
          t = Path('index.html').read_text(encoding='utf-8')
          if 'regata-badge-live' not in t:
              t = t.replace(
                  'id="regata-badge-stato" style="display:none"></span>',
                  'id="regata-badge-stato" style="display:none"></span>\n            <span class="badge-live" id="regata-badge-live" style="display:none">LIVE</span>',
                  1)
          if 'regata-live-btn' not in t:
              t = t.replace(
                  'id="regata-descrizione">--</span>',
                  'id="regata-descrizione">--</span>\n        <span class="btn-segui-live" id="regata-live-btn" style="display:none">Segui LIVE</span>',
                  1)
          if 'class="badge-live"' not in t or '.badge-live{' not in t:
              if '.badge-live{' not in t:
                  t = t.replace('</style>', '.badge-live{display:inline-block;font-size:.72rem;font-weight:800;padding:.2rem .6rem;border-radius:999px;background:rgba(239,68,68,.2);color:#f87171;animation:lp 1.5s infinite}@keyframes lp{0%,100%{opacity:1}50%{opacity:.55}}.btn-segui-live{display:inline-flex;margin-top:.75rem;background:#ef4444;color:#fff;font-weight:800;padding:.5rem 1rem;border-radius:8px;text-decoration:none}.next-regata-card.is-live{border-color:rgba(248,113,113,.45)}</style>', 1)
          if 'href="live.html">Live' not in t:
              t = t.replace(
                  'data-i18n="nav_classifiche">Classifiche</a></li>',
                  'href="live.html">Live</a></li>\n            <li><a href="classifiche.html" data-i18n="nav_classifiche">Classifiche</a></li>',
                  1)
          t = re.sub(r'index-inline\.js(\?v=\d+)?', 'index-inline.js?v=9', t)
          Path('index.html').write_text(t, encoding='utf-8')
          print('index ok', 'LIVE' in t)

          # --- index-inline.js ---
          j = Path('index-inline.js').read_text(encoding='utf-8')
          if 'badgeLive' not in j:
              j = j.replace(
                  "document.getElementById('regata-badge-stato');",
                  "document.getElementById('regata-badge-stato');\n  const badgeLive = document.getElementById('regata-badge-live');\n  const liveBtnEl = document.getElementById('regata-live-btn');",
                  1)
          if 'liveBtnEl' in j and "badgeLive.style.display" not in j:
              j = j.replace(
                  "('live.html?id=' + gara.id) : 'gare.html';",
                  "('live.html?id=' + encodeURIComponent(gara.id)) : 'gare.html';\n    if (badgeLive) badgeLive.style.display = (inLive || st2.key === 'corso') ? '' : 'none';\n    if (liveBtnEl) liveBtnEl.style.display = (inLive || st2.key === 'corso' || st2.key === 'chiuse') ? '' : 'none';\n    card.classList.toggle('is-live', !!(inLive || st2.key === 'corso'));",
                  1)
          Path('index-inline.js').write_text(j, encoding='utf-8')
          print('js ok', 'badgeLive' in j)

          # --- gare.html ---
          g = Path('gare.html').read_text(encoding='utf-8')
          if 'href="live.html">Live' not in g:
              g = g.replace(
                  'data-i18n="nav_classifiche">Classifiche</a></li>',
                  'href="live.html">Live</a></li>\n<li><a href="classifiche.html" data-i18n="nav_classifiche">Classifiche</a></li>',
                  1)
          Path('gare.html').write_text(g, encoding='utf-8')
          print('gare ok', 'live.html' in g)
          END
          git config user.name klaus681
          git config user.email klaus68@hotmail.it
          git add index.html index-inline.js gare.html
          git status
          git commit -m "Live UI: badge + Segui LIVE + menu" || echo nochange
          git push
