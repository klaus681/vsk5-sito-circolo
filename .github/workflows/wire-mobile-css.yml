name: wire-mobile-css
on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile.css'
      - '.github/workflows/wire-mobile-css.yml'
jobs:
  wire:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Link mobile.css in all HTML pages
        run: |
          python3 << 'PY'
          from pathlib import Path
          link = '<link rel="stylesheet" href="mobile.css">'
          changed = []
          for p in Path('.').glob('*.html'):
              t = p.read_text(encoding='utf-8')
              if 'mobile.css' in t:
                  continue
              if 'href="style.css"' in t:
                  t2 = t.replace(
                      '<link rel="stylesheet" href="style.css">',
                      '<link rel="stylesheet" href="style.css">\n  <link rel="stylesheet" href="mobile.css">',
                      1,
                  )
                  if t2 != t:
                      p.write_text(t2, encoding='utf-8')
                      changed.append(p.name)
                      continue
              # alternate quote styles
              if "href='style.css'" in t:
                  t2 = t.replace(
                      "<link rel=\"stylesheet\" href='style.css'>",
                      "<link rel=\"stylesheet\" href='style.css'>\n  <link rel=\"stylesheet\" href='mobile.css'>",
                      1,
                  )
                  if t2 != t:
                      p.write_text(t2, encoding='utf-8')
                      changed.append(p.name)
          print('changed', changed)
          PY
          git config user.name klaus681
          git config user.email klaus68@hotmail.it
          git add *.html mobile.css || true
          git status
          git diff --cached --stat || true
          git commit -m "Wire mobile.css on all pages" || echo "nothing to commit"
          git push
