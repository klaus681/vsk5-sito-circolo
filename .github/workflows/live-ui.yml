name: live-ui
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/live-ui.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # index.html
          t = Path('index.html').read_text(encoding='utf-8')
          css = '''
          .badge-live{display:inline-block;font-size:.72rem;font-weight:800;padding:.2rem .6rem;border-radius:999px;text-transform:uppercase;background:rgba(239,68,68,.2);color:#f87171;border:1px solid rgba(248,113,113,.45);animation:live-pulse 1.5s ease-in-out infinite}
          @keyframes live-pulse{0%,100%{opacity:1}50%{opacity:.55}}
          .next-regata-card.is-live{border-color:rgba(248,113,113,.45)}
          .btn-segui-live{display:inline-flex;margin-top:.75rem;background:#ef4444;color:#fff;font-weight:800;font-size:.88rem;padding:.5rem 1rem;border-radius:8px;text-decoration:none}
          '''
          if 'badge-live' not in t:
              t = t.replace('  </style>', css + '\n  </style>', 1)
          if 'href="live.html">Live' not in t:
              t = t.replace(
                  '<li><a href="classifiche.html" data-i18n="nav_classifiche">Classifiche</a></li>',
                  '<li><a href="live.html">Live</a></li>\n            <li><a href="classifiche.html" data-i18n="nav_classifiche">Classifiche</a></li>',
                  1)
          if 'regata-badge-live' not in t:
              t = t.replace(
                  'id="regata-badge-stato" style="display:none"></span>',
                  'id="regata-badge-stato" style="display:none"></span>\n            <span class="badge-live" id="regata-badge-live" style="display:none">LIVE</span>',
                  1)
          if 'regata-live-btn' not in t:
              t = t.replace(
                  '<span id="regata-descrizione">--</span>',
                  '<span id="regata-descrizione">--</span>\n        <span class="btn-segui-live" id="regata-live-btn" style="display:none">Segui LIVE</span>',
                  1)
          t = re.sub(r'index-inline\.js(\?v=\d+)?', 'index-inline.js?v=7', t)
          Path('index.html').write_text(t, encoding='utf-8')
          print('index.html ok')

          # index-inline.js
          j = Path('index-inline.js').read_text(encoding='utf-8')
          if 'badgeLive' not in j:
              j = j.replace(
                  "const badgeStato = document.getElementById('regata-badge-stato');",
                  "const badgeStato = document.getElementById('regata-badge-stato');\n  const badgeLive = document.getElementById('regata-badge-live');\n  const liveBtnEl = document.getElementById('regata-live-btn');",
                  1)
              j = j.replace(
                  "card.href = (inLive || st2.key === 'corso' || st2.key === 'chiuse') ? ('live.html?id=' + gara.id) : 'gare.html';",
                  "card.href = (inLive || st2.key === 'corso' || st2.key === 'chiuse') ? ('live.html?id=' + encodeURIComponent(gara.id)) : 'gare.html';\n    card.classList.toggle('is-live', !!(inLive || st2.key === 'corso'));\n    if (badgeLive) badgeLive.style.display = (inLive || st2.key === 'corso') ? '' : 'none';\n    if (liveBtnEl) liveBtnEl.style.display = (inLive || st2.key === 'corso' || st2.key === 'chiuse') ? '' : 'none';",
                  1)
          Path('index-inline.js').write_text(j, encoding='utf-8')
          print('index-inline.js ok')

          # gare.html - nav only + helpers + simple badge
          g = Path('gare.html').read_text(encoding='utf-8')
          if 'href="live.html">Live' not in g:
              g = g.replace(
                  '<li><a href="classifiche.html" data-i18n="nav_classifiche">Classifiche</a></li>',
                  '<li><a href="live.html">Live</a></li>\n<li><a href="classifiche.html" data-i18n="nav_classifiche">Classifiche</a></li>',
                  1)
          if 'function inLiveWindowGara' not in g:
              g = g.replace(
                  'function isGaraConclusa(dataGara){if(!dataGara)return false;return new Date(dataGara).getTime()<Date.now()}',
                  "function isGaraConclusa(dataGara){if(!dataGara)return false;return new Date(dataGara).getTime()<Date.now()}\nfunction inLiveWindowGara(g){if(!g||!g.data_gara)return false;var s=new Date(g.data_gara).getTime();if(isNaN(s))return false;var nr=Math.min(3,Math.max(1,parseInt(g.num_regate,10)||1));var d=Math.max(2,nr*1.5)*3600000;var n=Date.now();return n>=s-6*3600000&&n<=s+d+2*3600000}\nfunction statoKeyGara(g){if(!g||!g.data_gara)return'none';var s=new Date(g.data_gara).getTime();if(isNaN(s))return'none';var n=Date.now();var nr=Math.min(3,Math.max(1,parseInt(g.num_regate,10)||1));var d=Math.max(2,nr*1.5)*3600000;if(n>=s+d)return'conclusa';if(n>=s)return'corso';return'upcoming'}",
                  1)
          if 'btn-live-gara' not in g:
              g = g.replace(
                  '.admin-card-actions{display:flex;gap:.4rem;margin-left:auto}',
                  '.admin-card-actions{display:flex;gap:.4rem;margin-left:auto}.badge-live{display:inline-block;background:rgba(239,68,68,.2);color:#f87171;border:1px solid rgba(248,113,113,.45);font-size:.72rem;font-weight:800;padding:.2rem .55rem;border-radius:999px}.btn-live-gara{display:inline-flex;background:#ef4444;color:#fff;padding:.55rem 1.15rem;border-radius:8px;font-weight:800;font-size:.88rem;text-decoration:none}.gara-card.is-live{border-color:rgba(248,113,113,.4)}',
                  1)
          if 'inLiveWindowGara(g);const stKey' not in g:
              g = g.replace(
                  'return`<div class="gara-card${conclusa?',
                  'const live=inLiveWindowGara(g);const stKey=statoKeyGara(g);return`<div class="gara-card${conclusa?',
                  1)
              g = g.replace(
                  "${conclusa?' is-conclusa':''}\" data-gara-id=",
                  "${conclusa?' is-conclusa':''}${live||stKey==='corso'?' is-live':''}\" data-gara-id=",
                  1)
              g = g.replace(
                  '<span class="badge-regate">${badgeRegate(nr)}</span>${conclusa?',
                  '<span class="badge-regate">${badgeRegate(nr)}</span>${live||stKey===\'corso\'?`<span class="badge-live">LIVE</span>`:\'\''}${conclusa?',
                  1)
              g = g.replace(
                  '<div class="gara-actions">${renderActionButton(g.id,conclusa,g.data_gara)}',
                  '<div class="gara-actions">${(live||stKey===\'corso\')?`<a class="btn-live-gara" href="live.html?id=${encodeURIComponent(g.id)}">Segui LIVE</a>`:\'\''}${renderActionButton(g.id,conclusa,g.data_gara)}',
                  1)
          Path('gare.html').write_text(g, encoding='utf-8')
          print('gare.html ok')
          print('ALL DONE')
          PY
          git config user.name klaus681
          git config user.email klaus68@hotmail.it
          git add index.html index-inline.js gare.html
          git status
          git diff --cached --stat
          git diff --cached --quiet || git commit -m "Live UI: badge, Segui LIVE, menu"
          git push
