name: test-write
on:
  push:
    paths:
      - '.github/workflows/test-write.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo test > ci-write-test.txt
          git config user.name klaus681
          git config user.email klaus68@hotmail.it
          git add ci-write-test.txt
          git commit -m "CI write test"
          git push
