name: apply-live-simple
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-live-simple.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch Live links
        run: |
          set -e
          if ! grep -q 'href="live.html">Live' index.html; then
            sed -i 's|<li><a href="classifiche.html" data-i18n="nav_classifiche">Classifiche</a></li>|<li><a href="live.html">Live</a></li>\n            <li><a href="classifiche.html" data-i18n="nav_classifiche">Classifiche</a></li>|' index.html
            sed -i 's|<a href="gare.html">→ Calendario</a>|<a href="gare.html">→ Calendario</a>\n      <a href="live.html">→ Live</a>|' index.html
          fi
          if ! grep -q 'regata-badge-live' index.html; then
            sed -i 's|id="regata-badge-stato" style="display:none"></span>|id="regata-badge-stato" style="display:none"></span>\n            <span class="badge-live" id="regata-badge-live" style="display:none">● LIVE</span>|' index.html
            sed -i 's|<span id="regata-descrizione">--</span>|<span id="regata-descrizione">--</span>\n        <span class="btn-segui-live" id="regata-live-btn" style="display:none">● Segui LIVE</span>|' index.html || true
          fi
          if ! grep -q 'badge-live' index.html; then
            sed -i 's|.badge-stato.is-conclusa { background: rgba(148,163,184,0.2); color: #94a3b8; }|.badge-stato.is-conclusa { background: rgba(148,163,184,0.2); color: #94a3b8; }\n    .badge-live { display:inline-block; font-size:0.72rem; font-weight:800; padding:0.2rem 0.6rem; border-radius:999px; text-transform:uppercase; background:rgba(239,68,68,0.2); color:#f87171; border:1px solid rgba(248,113,113,0.45); animation:live-pulse 1.5s ease-in-out infinite; }\n    @keyframes live-pulse { 0%,100%{opacity:1} 50%{opacity:0.55} }\n    .btn-segui-live { display:inline-flex; margin-top:0.75rem; background:#ef4444; color:#fff; font-weight:800; font-size:0.88rem; padding:0.5rem 1rem; border-radius:8px; }\n    .next-regata-card.is-live { border-color:rgba(248,113,113,0.45); }|' index.html
          fi
          sed -i 's|index-inline.js?v=3|index-inline.js?v=5|g' index.html
          if ! grep -q 'href="live.html">Live' gare.html; then
            sed -i 's|<li><a href="classifiche.html" data-i18n="nav_classifiche">Classifiche</a></li>|<li><a href="live.html">Live</a></li>\n<li><a href="classifiche.html" data-i18n="nav_classifiche">Classifiche</a></li>|' gare.html
            sed -i 's|<div class="mobile-dropdown"><a href="gare.html">→ Calendario</a><a href="classifiche.html">→ Classifiche</a></div>|<div class="mobile-dropdown"><a href="gare.html">→ Calendario</a><a href="live.html">→ Live</a><a href="classifiche.html">→ Classifiche</a></div>|' gare.html
          fi
          if ! grep -q 'regata-badge-live' index-inline.js; then
            sed -i "s|const badgeStato = document.getElementById('regata-badge-stato');|const badgeStato = document.getElementById('regata-badge-stato');\n  const badgeLive = document.getElementById('regata-badge-live');\n  const liveBtn = document.getElementById('regata-live-btn');|" index-inline.js
            sed -i "s|card.href = (inLive || st2.key === 'corso' || st2.key === 'chiuse') ? ('live.html?id=' + gara.id) : 'gare.html';|card.href = (inLive || st2.key === 'corso' || st2.key === 'chiuse') ? ('live.html?id=' + encodeURIComponent(gara.id)) : 'gare.html';\n    if (badgeLive) badgeLive.style.display = (inLive || st2.key === 'corso') ? '' : 'none';\n    if (liveBtn) liveBtn.style.display = (inLive || st2.key === 'corso' || st2.key === 'chiuse') ? '' : 'none';\n    card.classList.toggle('is-live', !!(inLive || st2.key === 'corso'));|" index-inline.js
          fi
          git config user.name klaus681
          git config user.email klaus68@hotmail.it
          git add index.html index-inline.js gare.html
          git status
          git diff --cached --stat
          git diff --cached --quiet || git commit -m "Live: badge e link Segui LIVE su Home e menu"
          git push
