<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Admin – CVI Virtual</title>
  <meta name="robots" content="noindex">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="style.css?v=2">
  <link rel="stylesheet" href="mobile.css">
  <link rel="stylesheet" href="fix-nav.css?v=3">
  <style>
    .admin-page { max-width: 1100px; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
    .admin-tabs { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1.25rem; }
    .admin-tab { background: transparent; border: 1px solid rgba(255,255,255,0.1); color: #94a3b8; padding: 0.45rem 0.9rem; border-radius: 8px; cursor: pointer; }
    .admin-tab.active { background: rgba(56,189,248,0.15); color: #7dd3fc; }
    .admin-panel { display: none; }
    .admin-panel.active { display: block; }
    body { background: #0b0f19; color: #e2e8f0; font-family: system-ui, sans-serif; margin: 0; }
  </style>
</head>
<body>
  <main class="admin-page" id="main-content">
    <div id="admin-gate"><h2>Ricarica la pagina</h2><p>admin.html è in ripristino. Ricarica tra pochi secondi.</p></div>
    <div id="admin-app" style="display:none">
      <div class="admin-tabs">
        <button type="button" class="admin-tab" data-tab="siti-amici">Siti amici</button>
      </div>
      <div id="panel-siti-amici" class="admin-panel">
        <p>Pannello in aggiornamento. Usa il commit completo a breve.</p>
      </div>
    </div>
  </main>
  <script src="common.js?v=8"></script>
  <script src="admin.js?v=22"></script>
  <script src="siti-amici-admin.js?v=1"></script>
</body>
</html>
