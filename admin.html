<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin – CVI Virtual</title>
  <style>
    body { background:#0b0f19; color:#e2e8f0; font-family: system-ui, sans-serif; margin:0; display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .load { color:#7dd3fc; font-size:1.1rem; }
  </style>
</head>
<body>
  <p class="load" id="msg">Caricamento pannello admin…</p>
  <script>
  (async function () {
    var msg = document.getElementById('msg');
    try {
      var url = 'https://raw.githubusercontent.com/klaus681/vsk5-sito-circolo/a11890d991f816f207067fa1c0078822279369f9/admin.html';
      var res = await fetch(url + '?t=' + Date.now());
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var html = await res.text();
      if (!html || html.indexOf('panel-gare') < 0) throw new Error('Contenuto non valido');

      // Cache-bust admin.js e aggiungi tab Regolamento se manca
      html = html.replace(/admin\.js\?v=\d+/g, 'admin.js?v=12');

      if (html.indexOf('data-tab="regolamento"') < 0) {
        html = html.replace(
          '<button type="button" class="admin-tab" data-tab="export">Export</button>',
          '<button type="button" class="admin-tab" data-tab="regolamento">Regolamento</button>\n        <button type="button" class="admin-tab" data-tab="export">Export</button>'
        );
      }

      // Pannello vuoto se manca (riempito da regolamento-admin.js)
      if (html.indexOf('id="panel-regolamento"') < 0) {
        html = html.replace(
          '<div id="panel-export" class="admin-panel">',
          '<div id="panel-regolamento" class="admin-panel"><p class="loading-text">Caricamento regolamento…</p></div>\n      <div id="panel-export" class="admin-panel">'
        );
      }

      // Script esplicito regolamento-admin (oltre al loader in admin.js)
      if (html.indexOf('regolamento-admin.js') < 0) {
        html = html.replace(
          /<script src="admin\.js\?v=\d+"><\/script>/,
          '<script src="admin.js?v=12"></script>\n  <script src="regolamento-admin.js?v=2"></script>'
        );
      }

      document.open();
      document.write(html);
      document.close();
    } catch (e) {
      msg.style.color = '#f87171';
      msg.innerHTML = 'Errore ripristino admin: ' + (e.message || e) +
        '<br><br><a href="https://github.com/klaus681/vsk5-sito-circolo/blob/a11890d991f816f207067fa1c0078822279369f9/admin.html" style="color:#7dd3fc">Apri file su GitHub</a>';
    }
  })();
  </script>
</body>
</html>
