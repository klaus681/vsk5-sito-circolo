<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin – CVI Virtual</title>
  <style>
    body { background:#0b0f19; color:#e2e8f0; font-family: system-ui, sans-serif; margin:0; display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .load { color:#7dd3fc; font-size:1.1rem; }
  </style>
</head>
<body>
  <p class="load" id="msg">Caricamento pannello admin…</p>
  <script>
  (async function () {
    var msg = document.getElementById('msg');
    try {
      // Versione funzionante precedente (prima del danno)
      var url = 'https://raw.githubusercontent.com/klaus681/vsk5-sito-circolo/a11890d991f816f207067fa1c0078822279369f9/admin.html';
      var res = await fetch(url + '?t=' + Date.now());
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var html = await res.text();
      if (!html || html.indexOf('panel-gare') < 0) throw new Error('Contenuto non valido');
      document.open();
      document.write(html);
      document.close();
    } catch (e) {
      msg.style.color = '#f87171';
      msg.innerHTML = 'Errore ripristino admin: ' + (e.message || e) +
        '<br><br><a href="https://github.com/klaus681/vsk5-sito-circolo/blob/a11890d991f816f207067fa1c0078822279369f9/admin.html" style="color:#7dd3fc">Apri file su GitHub</a>';
    }
  })();
  </script>
</body>
</html>
