<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin – CVI Virtual</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="mobile.css">
  <link rel="stylesheet" href="fix-nav.css">
  <style>
    .admin-page { max-width: 1100px; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
    .admin-header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
    .admin-header h1 { margin: 0; font-size: 1.55rem; color: #fff; font-family: 'Playfair Display', Georgia, serif; }
    .admin-header .sub { color: #94a3b8; font-size: 0.9rem; margin-top: 0.2rem; }
    .admin-who-box { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
    .role-badge { background: rgba(56,189,248,0.15); color: #7dd3fc; border: 1px solid rgba(56,189,248,0.35); font-size: 0.75rem; font-weight: 700; padding: 0.25rem 0.65rem; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.04em; }
    .admin-status { min-height: 1.25rem; font-size: 0.88rem; font-weight: 600; margin-bottom: 0.75rem; }
    .admin-status.ok { color: #34d399; }
    .admin-status.err { color: #f87171; }
    .admin-tabs { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1.25rem; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 0.65rem; }
    .admin-tab { background: transparent; border: 1px solid rgba(255,255,255,0.1); color: #94a3b8; padding: 0.45rem 0.9rem; border-radius: 8px; font-family: inherit; font-size: 0.88rem; font-weight: 600; cursor: pointer; }
    .admin-tab:hover { color: #e2e8f0; border-color: rgba(56,189,248,0.35); }
    .admin-tab.active { background: rgba(56,189,248,0.15); color: #7dd3fc; border-color: rgba(56,189,248,0.45); }
    .admin-panel { display: none; }
    .admin-panel.active { display: block; }
    .admin-gate { text-align: center; padding: 3rem 1.5rem; background: #1a2332; border: 1px solid rgba(56,189,248,0.2); border-radius: 14px; margin-top: 2rem; }
    .admin-gate h2 { color: #fff; margin: 0 0 0.5rem; }
    .admin-gate p { color: #94a3b8; }
    .admin-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    .admin-table th { text-align: left; color: #94a3b8; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; padding: 0.5rem 0.6rem; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .admin-table td { padding: 0.55rem 0.6rem; border-bottom: 1px solid rgba(255,255,255,0.04); vertical-align: middle; }
    .admin-card { background: #1a2332; border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; padding: 1.1rem 1.25rem; margin-bottom: 0.85rem; }
    .admin-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; }
    .meta { color: #94a3b8; font-size: 0.82rem; margin-top: 0.2rem; }
    .card-desc { color: #cbd5e1; font-size: 0.9rem; margin: 0.5rem 0 0; }
    .adm-label { display: block; font-size: 0.75rem; font-weight: 600; color: #94a3b8; margin-bottom: 0.3rem; text-transform: uppercase; letter-spacing: 0.04em; }
    .adm-input, .adm-select { background: #0b0f19; color: #fff; border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; padding: 0.55rem 0.75rem; font-family: inherit; font-size: 0.9rem; }
    .form-grid { display: grid; gap: 0.75rem; }
    .form-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-top: 0.25rem; }
    .btn-sm { background: transparent; color: #7dd3fc; border: 1px solid rgba(56,189,248,0.4); padding: 0.3rem 0.65rem; border-radius: 6px; font-size: 0.78rem; font-weight: 600; cursor: pointer; font-family: inherit; }
    .btn-danger-sm { background: transparent; color: #f87171; border: 1px solid rgba(248,113,113,0.4); padding: 0.3rem 0.65rem; border-radius: 6px; font-size: 0.78rem; font-weight: 600; cursor: pointer; font-family: inherit; }
    .btn-ghost { background: transparent; color: #94a3b8; border: 1px solid rgba(255,255,255,0.15); padding: 0.45rem 0.9rem; border-radius: 8px; font-weight: 600; font-size: 0.88rem; cursor: pointer; font-family: inherit; }
    .loading-text, .empty-text { color: #94a3b8; }
    .sql-hint { background: rgba(251,191,36,0.1); border: 1px solid rgba(251,191,36,0.3); color: #fbbf24; padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.88rem; margin-bottom: 1rem; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 1.25rem; border-bottom: 1px solid rgba(255,255,255,0.06); background: #0b0f19; }
    .logo-text { font-weight: 700; color: #fff; }
    .logo-text span { color: #38bdf8; }
    .nav-desktop ul { list-style: none; display: flex; gap: 1rem; margin: 0; padding: 0; }
    .nav-desktop a { color: #94a3b8; text-decoration: none; font-weight: 600; font-size: 0.9rem; }
    body { background: #0b0f19; color: #e2e8f0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; margin: 0; }
  </style>
</head>
<body>
  <header>
    <a href="index.html" style="text-decoration:none"><span class="logo-text">⚓ CVI <span>Virtual</span></span></a>
    <nav class="nav-desktop"><ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="membri.html">Membri</a></li>
      <li><a href="gare.html">Gare</a></li>
      <li><a href="admin.html" style="color:#38bdf8;font-weight:700">Admin</a></li>
    </ul></nav>
    <a href="accedi.html" id="auth-link" class="btn-ghost" style="text-decoration:none">Accedi</a>
  </header>
  <main class="admin-page">
    <div id="admin-gate" class="admin-gate" style="display:block">
      <h2 id="gate-title">Caricamento…</h2>
      <p id="gate-text">Verifica accesso al pannello admin.</p>
      <a href="accedi.html" class="btn-primary" id="gate-login-link" style="margin-top:1rem;display:inline-block">Vai al login</a>
    </div>
    <div id="admin-app" style="display:none">
      <div class="admin-header">
        <div><h1>Pannello Admin</h1><div class="sub">Gestione centralizzata del Circolo Velico Italia</div></div>
        <div class="admin-who-box">
          <span id="admin-who" style="color:#e2e8f0;font-weight:600"></span>
          <span class="role-badge" id="admin-role-badge">Admin</span>
          <button type="button" class="btn-ghost" id="admin-logout-btn">Disconnetti</button>
        </div>
      </div>
      <div id="admin-status" class="admin-status"></div>
      <div class="admin-tabs" role="tablist">
        <button type="button" class="admin-tab" data-tab="soci">Soci</button>
        <button type="button" class="admin-tab" data-tab="team">Team</button>
        <button type="button" class="admin-tab" data-tab="gare">Gare</button>
        <button type="button" class="admin-tab" data-tab="risultati">Risultati</button>
        <button type="button" class="admin-tab" data-tab="avvisi">Avvisi</button>
        <button type="button" class="admin-tab" data-tab="proteste">Proteste</button>
        <button type="button" class="admin-tab" data-tab="eventi-aperti">Eventi aperti</button>
        <button type="button" class="admin-tab" data-tab="galleria">Galleria</button>
        <button type="button" class="admin-tab" data-tab="download">Download</button>
        <button type="button" class="admin-tab" data-tab="impostazioni">Impostazioni</button>
        <button type="button" class="admin-tab" data-tab="export">Export</button>
      </div>
SEE_ARTIFACTS_FOR_REST
    </div>
  </main>
  <script src="common.js"></script>
  <script src="admin.js?v=5"></script>
</body>
</html>
