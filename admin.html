<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin – CVI Virtual</title>
<script>
(async function () {
  const urls = [
    'https://raw.githubusercontent.com/klaus681/vsk5-sito-circolo/eda97525872d1a510b8e08f493eceb7c59971bfd/admin.html',
    'https://cdn.jsdelivr.net/gh/klaus681/vsk5-sito-circolo@eda97525872d1a510b8e08f493eceb7c59971bfd/admin.html'
  ];
  let html = null, lastErr = null;
  for (const src of urls) {
    try {
      const res = await fetch(src);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      html = await res.text();
      if (html && html.indexOf('Pannello Admin') !== -1) break;
      html = null;
    } catch (e) { lastErr = e; }
  }
  if (!html) {
    document.body.innerHTML = '<p style="color:#fff;padding:2rem;font-family:sans-serif">Errore caricamento admin. Ricarica.<br><small>' + lastErr + '</small></p>';
    return;
  }

  // --- Tabs: team, download, impostazioni ---
  if (html.indexOf('data-tab="team"') === -1) {
    html = html.replace(
      'data-tab="soci">Soci</button>',
      'data-tab="soci">Soci</button>\n        <button type="button" class="admin-tab" data-tab="team">Team</button>'
    );
  }
  if (html.indexOf('data-tab="download"') === -1) {
    html = html.replace(
      'data-tab="galleria">Galleria</button>',
      'data-tab="galleria">Galleria</button>\n        <button type="button" class="admin-tab" data-tab="download">Download</button>\n        <button type="button" class="admin-tab" data-tab="impostazioni">Impostazioni</button>'
    );
  } else if (html.indexOf('data-tab="impostazioni"') === -1) {
    html = html.replace(
      'data-tab="download">Download</button>',
      'data-tab="download">Download</button>\n        <button type="button" class="admin-tab" data-tab="impostazioni">Impostazioni</button>'
    );
  }

  // --- Panel Team ---
  if (html.indexOf('panel-team') === -1) {
    var panelTeam =
      '<div id="panel-team" class="admin-panel">' +
      '<div id="tm-sql-hint" class="sql-hint" style="display:none">Verifica tabella <code>teams</code> e policy RLS su Supabase (insert/update/delete per admin).</div>' +
      '<div class="admin-card">' +
      '<h3 id="tm-form-title" style="margin:0 0 0.75rem;color:#7dd3fc">Nuovo team</h3>' +
      '<form id="tm-form" class="form-grid">' +
      '<input type="hidden" id="tm-id">' +
      '<div><label class="adm-label" for="tm-nome">Nome team *</label><input class="adm-input" id="tm-nome" required maxlength="80" style="width:100%" placeholder="Es. Red Moon"></div>' +
      '<div><label class="adm-label" for="tm-capitano">Capitano</label><input class="adm-input" id="tm-capitano" maxlength="80" style="width:100%" placeholder="Nickname o nome"></div>' +
      '<div><label class="adm-label" for="tm-desc">Descrizione</label><textarea class="adm-input" id="tm-desc" rows="3" maxlength="500" style="width:100%" placeholder="Breve descrizione del team"></textarea></div>' +
      '<div class="form-actions">' +
      '<button type="submit" class="btn-primary" id="tm-save-btn">Salva team</button>' +
      '<button type="button" class="btn-ghost" id="tm-cancel-btn" style="display:none">Annulla</button>' +
      '</div></form></div>' +
      '<div id="tm-members-panel" class="admin-card" style="display:none;margin-top:1rem">' +
      '<h3 style="margin:0 0 0.65rem;color:#7dd3fc">Membri di: <span id="tm-mp-name" style="color:#fff"></span></h3>' +
      '<div id="tm-mp-list" style="margin-bottom:0.85rem"></div>' +
      '<div style="display:flex;gap:0.5rem;flex-wrap:wrap;align-items:center">' +
      '<select id="tm-mp-add-select" class="adm-select" style="flex:1;min-width:180px"></select>' +
      '<button type="button" class="btn-primary" id="tm-mp-add-btn" style="padding:0.45rem 0.9rem">Aggiungi</button>' +
      '<button type="button" class="btn-ghost" id="tm-mp-close">Chiudi</button>' +
      '</div>' +
      '<p id="tm-mp-status" style="margin:0.5rem 0 0;font-size:0.85rem;font-weight:500"></p>' +
      '</div>' +
      '<div id="tm-list" style="margin-top:1rem"><p class="loading-text">Caricamento…</p></div>' +
      '</div>';
    html = html.replace('<div id="panel-gare" class="admin-panel">', panelTeam + '<div id="panel-gare" class="admin-panel">');
  }

  if (html.indexOf('panel-download') === -1) {
    var panelDl = '<div id="panel-download" class="admin-panel">' +
      '<div id="dl-sql-hint" class="sql-hint" style="display:none">Crea tabella downloads in Supabase.</div>' +
      '<div class="admin-card"><h3 id="dl-form-title" style="margin:0 0 0.75rem;color:#7dd3fc">Nuovo download</h3>' +
      '<form id="dl-form" class="form-grid">' +
      '<input type="hidden" id="dl-id">' +
      '<div><label class="adm-label" for="dl-titolo">Titolo</label><input class="adm-input" id="dl-titolo" required style="width:100%"></div>' +
      '<div><label class="adm-label" for="dl-desc">Descrizione</label><textarea class="adm-input" id="dl-desc" rows="2" style="width:100%"></textarea></div>' +
      '<div><label class="adm-label" for="dl-url">URL file</label><input class="adm-input" id="dl-url" type="url" required style="width:100%"></div>' +
      '<div style="display:flex;gap:0.75rem;flex-wrap:wrap">' +
      '<div><label class="adm-label" for="dl-tipo">Tipo</label><select class="adm-select" id="dl-tipo"><option value="pdf">PDF</option><option value="zip">ZIP</option><option value="exe">EXE</option><option value="link">Link</option><option value="file">Altro</option></select></div>' +
      '<div><label class="adm-label" for="dl-ordine">Ordine</label><input type="number" class="adm-input" id="dl-ordine" value="0" style="width:5rem"></div>' +
      '<div style="display:flex;align-items:flex-end"><label style="display:flex;align-items:center;gap:0.4rem;color:#e2e8f0;font-size:0.88rem"><input type="checkbox" id="dl-attivo" checked> Attivo</label></div></div>' +
      '<div class="form-actions"><button type="submit" class="btn-primary" id="dl-save-btn">Salva</button><button type="button" class="btn-ghost" id="dl-cancel-btn" style="display:none">Annulla</button></div>' +
      '</form></div><div id="dl-list"><p class="loading-text">Caricamento…</p></div></div>';
    html = html.replace('<div id="panel-export" class="admin-panel">', panelDl + '<div id="panel-export" class="admin-panel">');
  }

  if (html.indexOf('panel-impostazioni') === -1) {
    var panelSet = '<div id="panel-impostazioni" class="admin-panel">' +
      '<div id="set-sql-hint" class="sql-hint" style="display:none">Crea la tabella site_settings in Supabase.</div>' +
      '<div class="admin-card">' +
      '<h3 style="margin:0 0 0.75rem;color:#7dd3fc">Banner Home (Hero)</h3>' +
      '<p style="color:#94a3b8;font-size:0.88rem;margin:0 0 1rem">Testi e pulsanti della sezione in alto. Lascia vuoto per il default.</p>' +
      '<form id="settings-hero-form" class="form-grid">' +
      '<div><label class="adm-label" for="set-home_community">Etichetta sopra il titolo</label><input class="adm-input" id="set-home_community" style="width:100%" placeholder="Circolo Velico Italia"></div>' +
      '<div><label class="adm-label" for="set-home_title">Titolo (HTML)</label><input class="adm-input" id="set-home_title" style="width:100%" placeholder="Regate vere,<br><em>mari virtuali.</em>"></div>' +
      '<div><label class="adm-label" for="set-home_subtitle">Sottotitolo</label><textarea class="adm-input" id="set-home_subtitle" rows="2" style="width:100%"></textarea></div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem">' +
      '<div><label class="adm-label" for="set-home_cta1_text">Pulsante 1 – testo</label><input class="adm-input" id="set-home_cta1_text" style="width:100%" placeholder="Calendario Regate"></div>' +
      '<div><label class="adm-label" for="set-home_cta1_href">Pulsante 1 – link</label><input class="adm-input" id="set-home_cta1_href" style="width:100%" placeholder="gare.html"></div>' +
      '<div><label class="adm-label" for="set-home_cta2_text">Pulsante 2 – testo</label><input class="adm-input" id="set-home_cta2_text" style="width:100%" placeholder="Unisciti al Circolo"></div>' +
      '<div><label class="adm-label" for="set-home_cta2_href">Pulsante 2 – link</label><input class="adm-input" id="set-home_cta2_href" style="width:100%" placeholder="unisciti.html"></div>' +
      '</div>' +
      '<div class="form-actions"><button type="submit" class="btn-primary" id="set-hero-save-btn">Salva banner</button></div>' +
      '</form></div>' +
      '<div class="admin-card" style="margin-top:1rem">' +
      '<h3 style="margin:0 0 0.75rem;color:#7dd3fc">Statistiche Home</h3>' +
      '<p style="color:#94a3b8;font-size:0.88rem;margin:0 0 1rem">Box Soci / Squadre / Regate / Dal. Lascia vuoto il valore per il conteggio automatico.</p>' +
      '<form id="settings-stats-form" class="form-grid">' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem">' +
      '<div><label class="adm-label" for="set-home_stat_soci_label">Etichetta Soci</label><input class="adm-input" id="set-home_stat_soci_label" style="width:100%" placeholder="Soci"></div>' +
      '<div><label class="adm-label" for="set-home_stat_soci_value">Valore Soci (opz.)</label><input class="adm-input" id="set-home_stat_soci_value" style="width:100%" placeholder="auto dal DB"></div>' +
      '<div><label class="adm-label" for="set-home_stat_squadre_label">Etichetta Squadre</label><input class="adm-input" id="set-home_stat_squadre_label" style="width:100%" placeholder="Squadre"></div>' +
      '<div><label class="adm-label" for="set-home_stat_squadre_value">Valore Squadre (opz.)</label><input class="adm-input" id="set-home_stat_squadre_value" style="width:100%" placeholder="auto dal DB"></div>' +
      '<div><label class="adm-label" for="set-home_stat_regate_label">Etichetta Regate</label><input class="adm-input" id="set-home_stat_regate_label" style="width:100%" placeholder="Regate 2026"></div>' +
      '<div><label class="adm-label" for="set-home_stat_regate_value">Valore Regate (opz.)</label><input class="adm-input" id="set-home_stat_regate_value" style="width:100%" placeholder="auto dal DB"></div>' +
      '<div><label class="adm-label" for="set-home_stat_dal_label">Etichetta Dal</label><input class="adm-input" id="set-home_stat_dal_label" style="width:100%" placeholder="Dal"></div>' +
      '<div><label class="adm-label" for="set-home_stat_dal_value">Valore Dal (opz.)</label><input class="adm-input" id="set-home_stat_dal_value" style="width:100%" placeholder="2003"></div>' +
      '</div>' +
      '<div class="form-actions"><button type="submit" class="btn-primary" id="set-stats-save-btn">Salva statistiche</button></div>' +
      '</form></div>' +
      '<div class="admin-card" style="margin-top:1rem">' +
      '<h3 style="margin:0 0 0.75rem;color:#7dd3fc">Video YouTube in Home</h3>' +
      '<p style="color:#94a3b8;font-size:0.88rem;margin:0 0 1rem">Sezione «Ultime Regate & Highlights».</p>' +
      '<form id="settings-form" class="form-grid">' +
      '<div><label class="adm-label" for="set-youtube">URL o ID YouTube</label><input class="adm-input" id="set-youtube" style="width:100%" placeholder="https://www.youtube.com/watch?v=..."></div>' +
      '<div class="form-actions"><button type="submit" class="btn-primary" id="set-save-btn">Salva video</button></div>' +
      '</form><div id="set-youtube-preview" style="margin-top:1rem"></div></div>' +
      '<div class="admin-card" style="margin-top:1rem">' +
      '<h3 style="margin:0 0 0.75rem;color:#7dd3fc">Notifiche Discord</h3>' +
      '<p style="color:#94a3b8;font-size:0.88rem;margin:0 0 1rem">Incolla l\'URL del webhook del canale. Avvisi e nuove gare invieranno un messaggio automatico. Crea il webhook: Discord → Impostazioni canale → Integrazioni → Webhook.</p>' +
      '<form id="settings-discord-form" class="form-grid">' +
      '<div><label class="adm-label" for="set-discord-webhook">URL Webhook</label><input class="adm-input" id="set-discord-webhook" style="width:100%" placeholder="https://discord.com/api/webhooks/..." autocomplete="off"></div>' +
      '<div class="form-actions" style="display:flex;gap:0.5rem;flex-wrap:wrap">' +
      '<button type="submit" class="btn-primary" id="set-discord-save-btn">Salva webhook</button>' +
      '<button type="button" class="btn-ghost" id="set-discord-test-btn">Invia test</button>' +
      '</div></form></div></div>';
    html = html.replace('<div id="panel-export" class="admin-panel">', panelSet + '<div id="panel-export" class="admin-panel">');
  }

  document.open();
  document.write(html);
  document.close();
})();
</script>
</head>
<body style="background:#0b0f19;color:#94a3b8;font-family:sans-serif;padding:2rem">
  Caricamento pannello admin…
</body>
</html>
