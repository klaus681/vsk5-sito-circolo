<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin – CVI Virtual</title>
<script>
(async function(){
  var urls = [
    'https://cdn.jsdelivr.net/gh/klaus681/vsk5-sito-circolo@13591de807901bdfebe584db659d788ecd1d2bb1/admin.html',
    'https://raw.githubusercontent.com/klaus681/vsk5-sito-circolo/13591de807901bdfebe584db659d788ecd1d2bb1/admin.html'
  ];
  var html = null, lastErr = null;
  for (var i = 0; i < urls.length; i++) {
    try {
      var res = await fetch(urls[i]);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      html = await res.text();
      if (html && html.indexOf('admin-tabs') !== -1) break;
      html = null;
    } catch (e) { lastErr = e; }
  }
  if (!html) {
    document.body.innerHTML = '<p style="color:#fff;padding:2rem">Errore caricamento Admin.<br><small>' + lastErr + '</small></p>';
    return;
  }
  // Inject Proteste tab if missing
  if (html.indexOf('data-tab="proteste"') === -1) {
    html = html.replace(
      '<button type="button" class="admin-tab" data-tab="avvisi">Avvisi</button>',
      '<button type="button" class="admin-tab" data-tab="avvisi">Avvisi</button>\n        <button type="button" class="admin-tab" data-tab="proteste">Proteste</button>'
    );
    html = html.replace(
      '<div id="panel-soci" class="admin-panel">',
      '<div id="panel-proteste" class="admin-panel">\n        <div style="display:flex;gap:0.75rem;flex-wrap:wrap;align-items:center;margin-bottom:0.85rem">\n          <label class="adm-label" for="proteste-filter" style="margin:0">Filtro</label>\n          <select id="proteste-filter" class="adm-select">\n            <option value="all">Tutte</option>\n            <option value="pending">In attesa</option>\n            <option value="in_esame">In esame</option>\n            <option value="accolta">Accolta</option>\n            <option value="respinta">Respinta</option>\n            <option value="ritirata">Ritirata</option>\n          </select>\n          <button type="button" class="btn-ghost" onclick="if(typeof loadProtesteAdmin===\'function\')loadProtesteAdmin()">Aggiorna</button>\n        </div>\n        <div id="proteste-admin-list"><p class="loading-text">Apri questa scheda per caricare le proteste.</p></div>\n      </div>\n      <div id="panel-soci" class="admin-panel">'
    );
  }
  document.open();
  document.write(html);
  document.close();
})();
</script>
</head>
<body style="background:#0b0f19;color:#94a3b8;font-family:sans-serif;padding:2rem">Caricamento pannello admin…</body>
</html>
