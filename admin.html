<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin – CVI Virtual</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0f19">
  <style>body{background:#0b0f19;color:#94a3b8;font-family:system-ui,sans-serif;margin:0;padding:2rem;text-align:center}</style>
</head>
<body>
  <p id="msg">Caricamento pannello admin…</p>
  <script>
  (async function () {
    var urls = [
      "https://cdn.jsdelivr.net/gh/klaus681/vsk5-sito-circolo@main/admin-full.html",
      "https://raw.githubusercontent.com/klaus681/vsk5-sito-circolo/main/admin-full.html"
    ];
    var html = null;
    for (var i = 0; i < urls.length; i++) {
      try {
        var r = await fetch(urls[i], { cache: "no-store" });
        if (r.ok) { html = await r.text(); break; }
      } catch (e) {}
    }
    if (!html) {
      // fallback to known good commit with poster patch inject
      try {
        var r2 = await fetch("https://cdn.jsdelivr.net/gh/klaus681/vsk5-sito-circolo@26276f0cc6b60e0a2685e1eae2907533de073819/admin.html", { cache: "no-store" });
        if (r2.ok) html = await r2.text();
      } catch (e) {}
    }
    if (!html) {
      document.getElementById("msg").textContent =
        "Impossibile caricare il pannello admin. Ricarica o contatta l'amministratore.";
      return;
    }
    if (html.indexOf("eventi-admin-patch.js") < 0) {
      html = html.replace(
        /(<script src="admin\.js\?v=\d+"><\/script>)/,
        '$1\n  <script src="eventi-admin-patch.js?v=2"><\/script>'
      );
    }
    // Force tab labels
    html = html.replace(/>Eventi aperti</g, ">Eventi · singoli<");
    html = html.replace(/>Serie Aperte</g, ">Eventi · serie<");
    document.open();
    document.write(html);
    document.close();
  })();
  </script>
</body>
</html>
