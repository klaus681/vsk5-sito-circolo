<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0f19">
  <meta name="robots" content="noindex">
  <meta name="description" content="Pagina offline del Circolo Velico Italia Virtual.">
  <title>Sei offline - CVI Virtual</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: radial-gradient(circle at 50% 30%, #16213a 0%, #0b0f19 68%);
      color: #e2e8f0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      text-align: center;
    }
    .box {
      width: 100%;
      max-width: 440px;
      padding: 2rem 1.5rem;
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.4);
    }
    img { width: 64px; height: 64px; margin-bottom: 0.75rem; }
    h1 { margin: 0 0 0.5rem; color: #38bdf8; font-size: 1.55rem; }
    p { margin: 0 0 1rem; color: #a8b4c7; font-size: 0.95rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center; margin-top: 1.25rem; }
    button, a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0.65rem 1.1rem;
      border-radius: 8px;
      border: 1px solid rgba(56, 189, 248, 0.35);
      font: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }
    button { background: #38bdf8; color: #0b0f19; border-color: #38bdf8; }
    button:hover { background: #7dd3fc; }
    a { color: #7dd3fc; background: transparent; }
    a:hover { background: rgba(56, 189, 248, 0.12); }
    .status { min-height: 1.4em; margin-top: 1rem; font-size: 0.85rem; color: #34d399; }
    :focus-visible { outline: 2px solid #38bdf8; outline-offset: 3px; }
  </style>
</head>
<body>
  <main class="box">
    <img src="logo-64.png" alt="Logo Circolo Velico Italia" width="64" height="64">
    <h1>Sei offline</h1>
    <p>Questa pagina non è ancora salvata sul dispositivo. Le pagine già visitate restano disponibili; controlla la connessione e riprova.</p>
    <div class="actions">
      <button type="button" id="retry">Riprova</button>
      <a href="index.html">Home</a>
      <a href="gare.html">Calendario</a>
      <a href="classifiche.html">Classifiche</a>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>
  <script>
    (function () {
      var status = document.getElementById('status');
      function setStatus(text) { if (status) status.textContent = text; }
      var retry = document.getElementById('retry');
      if (retry) retry.addEventListener('click', function () { window.location.reload(); });
      window.addEventListener('online', function () { setStatus('Connessione ripristinata. Puoi riprovare.'); });
      window.addEventListener('offline', function () { setStatus('Sei ancora offline.'); });
      if (navigator.onLine === false) setStatus('Nessuna connessione rilevata.');
    })();
  </script>
</body>
</html>
